// Perk-name label metrics, in SVG user units. LABEL_SIZE must match .plabel's
// font-size in the stylesheet -- the line spacing, the gap under the node, the
// crowding test and the wrap width are all derived from it, so changing the
// label size in one place keeps them in step.
const LABEL_SIZE = 15;
// Radius of the Nordic star flare behind an owned node, in SVG units.
const GLOW_R = NODE_R * 4.5;
// The flare bitmap lives in a CSS custom property (--tex-star) so the texture
// data sits with the rest of the theme. SVG <image href> cannot read a var(),
// so pull the URL out once at load and inline it.
const STAR_HREF = (() => {
  try{
    const raw = getComputedStyle(document.documentElement)
      .getPropertyValue("--tex-star").trim();
    const m = raw.match(/url\(["']?([^"')]+)["']?\)/);
    return m ? m[1] : "";
  }catch{ return ""; }
})();
// Radius of a rank pip, in SVG user units. Doubled from the original 2: at
// that size the pips were lost against the nebula even after brightening them.
// The pip row's pitch and its clearance above the node both derive from this.
const PIP_R = 4;
const LINE_H     = LABEL_SIZE;              // second line sits one em down
// Baseline offset below the node. The extra padding (was 4) drops the name
// clear of the node and its glow instead of crowding the star. Both the
// canvas height and the label-crowding test derive from this, so raising it
// reserves the matching space rather than clipping the bottom row.
const LABEL_GAP  = 11 + LABEL_SIZE * 0.6;
// Roughly how many characters fit on a line before wrapping. Wider glyphs mean
// fewer characters, so this shrinks as the label grows.
const WRAP_CHARS = Math.round(18 * 12 / LABEL_SIZE);

function layout(skill){
  // Each node has a grid cell (x,y) plus fractional offsets (h,v) that shift it
  // inside that cell. Those offsets are what give the in-game trees their
  // scattered look -- Warmaster's v of +2.4 lifts it well clear of its row --
  // so a plain grid does not reproduce the layout.
  //
  // Both axes are mirrored relative to the record: the mastery root is stored
  // at y=0 but drawn at the bottom growing upward, and x is counted from the
  // menu's right edge leftward.
  //
  // The fractional offsets have to be reflected along with the cell -- a true
  // mirror is (maxX - x) - h, not (maxX - x) + h. Negating only the cell
  // leaves each node nudged the wrong way inside it, which is what made the
  // connecting lines cross.
  const maxY = Math.max(...skill.perks.map(p => p.position.y));
  const maxX = Math.max(...skill.perks.map(p => p.position.x));

  const pos = new Map();
  skill.perks.forEach(p => {
    const q = p.position;
    pos.set(p.formId, {
      x: PAD_X + (maxX - q.x - (q.h || 0)) * CELL_W,
      y: PAD_Y + (maxY - q.y - (q.v || 0)) * CELL_H,
    });
  });

  // Offsets can push a node outside the nominal grid, so measure the real
  // extents and shift everything back into view.
  const xs = [...pos.values()].map(v => v.x), ys = [...pos.values()].map(v => v.y);
  const dx = Math.min(...xs) < PAD_X ? PAD_X - Math.min(...xs) : 0;
  const dy = Math.min(...ys) < PAD_Y ? PAD_Y - Math.min(...ys) : 0;
  if (dx || dy) pos.forEach(v => { v.x += dx; v.y += dy; });

  // A few trees place nodes close enough that their labels would collide.
  // The positions come from the game's own data, so rather than distort the
  // layout, drop the label on the tighter node of any genuinely overlapping
  // pair -- hovering still names it.
  //
  // This tests the labels' actual BOXES rather than the distance between their
  // nodes. The old test was `|dx| < 76 && |dy| < LABEL_GAP + LINE_H*2`, a fixed
  // guess that ignored how wide a label really is and how many lines it wraps
  // to. It cost exactly two labels in the whole modlist -- Restoration's Divine
  // Glory and Dawn's Wrath -- and neither actually overlapped: Divine Glory
  // cleared its neighbour by 3px horizontally, and Dawn's Wrath sat 37px below
  // its neighbour's single 15px line. Both were simply missing their name.
  const entries = [...pos.entries()];
  const crowded = new Set();
  const box = ([fid, v]) => {
    const e = PERK.get(fid);
    const lines = e ? wrapLabel(e.p.name) : [""];
    // Widest line drives the box. `labelWidth` is an approximation of the
    // rendered run; it only has to be good enough to separate "overlaps" from
    // "does not", and it errs wide.
    const w = Math.max(...lines.map(labelWidth));
    const top = v.y + NODE_R + LABEL_GAP - LINE_H;      // first line's top
    return {l: v.x - w / 2, r: v.x + w / 2,
            t: top, b: top + lines.length * LINE_H};
  };
  for (let i = 0; i < entries.length; i++){
    for (let j = i + 1; j < entries.length; j++){
      const A = box(entries[i]), B = box(entries[j]);
      // Overlap on BOTH axes, with a small breathing margin, is a collision.
      const M = 2;
      if (A.l < B.r + M && A.r + M > B.l && A.t < B.b + M && A.b + M > B.t){
        const a = entries[i][1], b = entries[j][1];
        crowded.add(entries[a.y >= b.y ? i : j][0]);
      }
    }
  }

  const fx = [...pos.values()].map(v => v.x), fy = [...pos.values()].map(v => v.y);
  return {
    pos, crowded,
    w: Math.max(...fx) + PAD_X,
    // Bottom row needs room for a two-line label under the node.
    h: Math.max(...fy) + NODE_R + LABEL_GAP + LINE_H * 2,
  };
}

// Relative star size. In-game the constellation is not a uniform dot grid --
// the mastery root is a large body and the leaves are small points -- so scale
// by how central the perk is: no prerequisites (the root) is biggest, and
// anything other perks depend on outranks a leaf.
function nodeScale(p){
  if (!p.prerequisites.length) return 1.5;      // mastery root
  return p._hasDependents ? 1.15 : 0.85;
}

// Mark which perks other perks require. Done once per tree rather than per
// node, since it is an O(n^2) scan over prerequisite lists.
function markDependents(skill){
  const needed = new Set();
  skill.perks.forEach(p => p.prerequisites.forEach(q => needed.add(q.formId)));
  skill.perks.forEach(p => { p._hasDependents = needed.has(p.formId); });
}

// Wrap a perk name onto at most two short lines so labels stay readable.
/* Width of one rendered label line, in SVG user units.

   Measured with the browser's own text metrics rather than approximated: the
   font is proportional, and characters range from 5.7 to 9.4 px wide at
   LABEL_SIZE, so any flat per-character constant either under-estimates (and
   lets labels overlap) or over-estimates (and hides labels needlessly).

   Canvas is used because it measures without touching the DOM, and the result
   is memoised -- the collision test is O(n^2) over a tree's perks, so the same
   handful of strings would otherwise be measured hundreds of times. Falls back
   to a deliberately generous per-character estimate if canvas is unavailable,
   which errs toward hiding rather than overlapping. */
const labelWidth = (() => {
  const cache = new Map();
  let ctx = null;
  try{
    ctx = document.createElement("canvas").getContext("2d");
    // Must match .plabel's font-size and the body font stack.
    ctx.font = `${LABEL_SIZE}px "Segoe UI", system-ui, -apple-system, sans-serif`;
  }catch{ ctx = null; }
  return (text) => {
    if (cache.has(text)) return cache.get(text);
    const w = ctx ? ctx.measureText(text).width : text.length * 9.4;
    cache.set(text, w);
    return w;
  };
})();

function wrapLabel(name){
  const words = name.split(" ");
  if (words.length === 1) return [name];
  const lines = [""];
  words.forEach(w => {
    const cur = lines[lines.length - 1];
    if (!cur) lines[lines.length - 1] = w;
    else if ((cur + " " + w).length <= WRAP_CHARS) lines[lines.length - 1] = cur + " " + w;
    else lines.push(w);
  });
  return lines.slice(0, 2);
}

// Just the constellation canvas. The modal draws its own header around this,
// so the tree markup stays free of chrome.
function renderTreeBody(s, spentAll, availAll){
  markDependents(s);
  const L = layout(s);
  const byId = new Map(s.perks.map(p => [p.formId, p]));

  // Edges first so nodes paint on top.
  const edges = [];
  s.perks.forEach(p => {
    const a = L.pos.get(p.formId);
    const from = S.ranks.get(p.formId) || 0;
    p.connections.forEach(cid => {
      const b = L.pos.get(cid);
      if (!a || !b) return;
      const to = S.ranks.get(cid) || 0;
      const cls = (from && to) ? "on" : (from ? "lit" : "");
      // Straight runs, like the constellation lines in the skill menu. Stop at
      // the node edge so the line meets the ring instead of passing under it.
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const gap = NODE_R + 2;
      const x1 = a.x + dx / len * gap, y1 = a.y + dy / len * gap;
      const x2 = b.x - dx / len * gap, y2 = b.y - dy / len * gap;
      // Endpoints are tagged so a repaint can relight the edge without
      // recomputing geometry.
      edges.push(`<line class="edge ${cls}" data-from="${p.formId}" data-to="${cid}"`
               + ` x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`);
    });
  });

  const nodes = s.perks.map(p => {
    const at = L.pos.get(p.formId);
    const have = S.ranks.get(p.formId) || 0;
    const met = prereqsMet(p);
    const affordable = spentAll < availAll;
    const state = have ? (have >= p.ranks ? "taken maxed" : "taken")
                       : (met && affordable ? "avail" : (met ? "" : "locked"));
    const lines = wrapLabel(p.name);
    const labelCls = have ? "taken" : (met && affordable ? "avail" : "");

    // Rank pips sit above the node; the tree grows upward, so the space below
    // a node is where its incoming edge arrives. Pitch and clearance derive
    // from PIP_R so the row cannot self-overlap or collide with the node when
    // the radius changes.
    let dots = "";
    if (p.ranks > 1){
      const pitch = PIP_R * 3;                  // gap of one radius between pips
      const span = (p.ranks - 1) * pitch;
      // Clear the node's ACTUAL radius, not the base: nodeScale() makes a
      // mastery root 1.5x, and using NODE_R put the pips inside it. The extra
      // PIP_R of padding keeps a visible gap rather than letting the pips sit
      // flush against the star.
      const cy = at.y - NODE_R * nodeScale(p) - PIP_R * 2;
      dots = `<g class="rankdots">` + Array.from({length: p.ranks}, (_, i) =>
        `<circle cx="${at.x - span/2 + i*pitch}" cy="${cy}" r="${PIP_R}"
                 class="${i < have ? "on" : ""}"/>`).join("") + `</g>`;
    }

    // The Nordic star flare sits behind the node. It is always emitted but is
    // opacity:0 unless the Nordic theme is active and the perk is owned, so
    // toggling the theme never needs to rebuild the tree.
    const flare = STAR_HREF
      ? `<image class="starglow" href="${STAR_HREF}" x="${at.x - GLOW_R}"
                y="${at.y - GLOW_R}" width="${GLOW_R * 2}" height="${GLOW_R * 2}"
                preserveAspectRatio="xMidYMid meet"/>`
      : "";

    // Star size follows the perk's place in the tree: the mastery root (no
    // prerequisites, the bottom of the constellation) is the brightest body,
    // leaves are small. This is what stops a Nordic tree reading as a uniform
    // dot grid.
    const r = NODE_R * nodeScale(p);

    return `<g class="pnode ${state}" data-fid="${p.formId}" tabindex="0"
               role="button" aria-pressed="${have>0}"
               aria-label="${esc(p.name)}, rank ${have} of ${p.ranks}">
        ${flare}
        <circle class="glow" cx="${at.x}" cy="${at.y}" r="${r + 7}"/>
        <circle class="halo" cx="${at.x}" cy="${at.y}" r="${r + 4}"/>
        <circle class="ring" cx="${at.x}" cy="${at.y}" r="${r}"/>
        <circle class="core" cx="${at.x}" cy="${at.y}" r="${Math.max(1, r - 4)}"/>
      </g>${dots}
      ${L.crowded.has(p.formId) ? "" :
        `<text class="plabel ${labelCls}" x="${at.x}" y="${at.y + NODE_R + LABEL_GAP}">${
          lines.map((ln, i) => `<tspan x="${at.x}" dy="${i ? LINE_H : 0}">${esc(ln)}</tspan>`).join("")
        }</text>`}`;
  }).join("");

  // xMidYMid so the tree centres in the modal's full-height canvas; "meet"
  // scales it to fit entirely, never cropping.
  return `<div class="canvas tipwrap" id="canvas">
      <svg viewBox="0 0 ${L.w} ${L.h}" preserveAspectRatio="xMidYMid meet">
        <g>${edges.join("")}</g>
        ${nodes}
      </svg>
    </div>`;
}

/* ============================================================== modal ===
   The tree moved behind a card, so the modal has to carry the context the
   always-on layout used to give for free: the perk budget (the constraint
   being spent) and a way to reach sibling skills without closing.
======================================================================== */

// null when closed; a skill editorId when open.
function modalSkill(){ return S.open ? skillById(S.open) : null; }

function hideTip(){
  const t = document.getElementById("tip");
  if (t) t.classList.remove("show");
}

function renderModal(){
  const modal = document.getElementById("modal");
  const sheet = document.getElementById("sheet");
  const s = modalSkill();

  if (!s){
    modal.classList.remove("show");
    sheet.innerHTML = "";
    syncScrollLock();
    return;
  }

  const avail = pointsAvailable(), spent = pointsSpent();
  const left = avail - spent;
  const lv = skillLevel(s);
  const invested = spentIn(s);

  sheet.innerHTML = `
    <header class="${s.category.toLowerCase()}">
      <span class="cat"></span>
      <h3 id="modalTitle">${esc(s.name)}</h3>
      <span class="lv">
        <b class="${invested ? "" : "base"}">${lv}</b>
        <i>${invested ? invested + " pts" : "base"}</i>
      </span>
      <span class="bank">
        <b class="num${left < 0 ? " over" : ""}">${left}</b>
        <i>points left</i>
      </span>
      <button class="close" data-close aria-label="Close perk tree">&times;</button>
    </header>
    <div class="note" id="modalNote">&nbsp;</div>
    ${renderTreeBody(s, spent, avail)}
    <div class="nav">
      <button class="chip danger" id="clearTree" data-clear
              ${invested ? "" : "disabled"}>Clear tree${invested ? ` (${invested})` : ""}</button>
      <span class="hintkeys">Click to buy · right-click to refund · Esc to close</span>
    </div>`;

  modal.classList.add("show");
  syncScrollLock();
}

// Repaint the open tree's states without re-running layout or replacing the
// SVG -- the geometry is unchanged, only ownership is.
function repaintTree(){
  const s = modalSkill();
  const sheet = document.getElementById("sheet");
  if (!s || !sheet) return;

  const avail = pointsAvailable(), spent = pointsSpent();
  const affordable = spent < avail;

  sheet.querySelectorAll(".pnode").forEach(g => {
    const entry = PERK.get(g.dataset.fid);
    if (!entry) return;
    const p = entry.p;
    const have = S.ranks.get(p.formId) || 0;
    const met = prereqsMet(p);
    g.classList.toggle("taken", have > 0);
    g.classList.toggle("maxed", have > 0 && have >= p.ranks);
    g.classList.toggle("avail", !have && met && affordable);
    g.classList.toggle("locked", !have && !met);
    g.setAttribute("aria-pressed", have > 0);
    g.setAttribute("aria-label", `${p.name}, rank ${have} of ${p.ranks}`);

    // Label colour tracks the node's state.
    const label = g.nextElementSibling && g.nextElementSibling.classList.contains("rankdots")
      ? g.nextElementSibling.nextElementSibling
      : g.nextElementSibling;
    if (label && label.classList.contains("plabel")){
      label.classList.toggle("taken", have > 0);
      label.classList.toggle("avail", !have && met && affordable);
    }
    // Rank pips.
    const dots = g.nextElementSibling;
    if (dots && dots.classList.contains("rankdots")){
      [...dots.children].forEach((c, i) => c.classList.toggle("on", i < have));
    }
  });

  sheet.querySelectorAll(".edge").forEach(line => {
    const from = S.ranks.get(line.dataset.from) || 0;
    const to = S.ranks.get(line.dataset.to) || 0;
    line.classList.toggle("on", !!(from && to));
    line.classList.toggle("lit", !!(from && !to));
  });

  // Header counters.
  const invested = spentIn(s);
  const lvB = sheet.querySelector(".sheet > header .lv b, header .lv b");
  if (lvB){
    lvB.textContent = skillLevel(s);
    lvB.classList.toggle("base", !invested);
    const lvI = lvB.parentElement.querySelector("i");
    if (lvI) lvI.textContent = invested ? invested + " pts" : "base";
  }
  const bank = sheet.querySelector(".bank b");
  if (bank){
    const left = avail - spent;
    bank.textContent = left;
    bank.classList.toggle("over", left < 0);
  }
  // Clear button tracks what there is to clear.
  const clear = sheet.querySelector("[data-clear]");
  if (clear){
    clear.disabled = !invested;
    clear.textContent = invested ? `Clear tree (${invested})` : "Clear tree";
  }
}

function openSkill(id){
  if (!skillById(id)) return;
  S.open = id;
  S.skill = id;                    // remembered as the last-viewed tree
  renderModal();
  saveHash();
  const sheet = document.getElementById("sheet");
  const first = sheet.querySelector(".close");
  if (first) first.focus();
}

function closeModal(){
  if (!S.open) return;
  const id = S.open;
  S.open = "";
  hideTip();
  renderModal();
  // Only the skill just closed can have changed; fall back to a full rebuild
  // if its card is somehow missing.
  if (!refreshCard(id)) renderGroups();
  saveHash();
  // Return focus to the card that opened it.
  const card = document.querySelector(`.skillcard[data-skill="${cssEsc(id)}"]`);
  if (card) card.focus();
}


function render(){
  const effects = activeEffects();
  renderFields();
  renderBudget();
  renderAttrs();
  renderDerived(effects);
  renderEffects(effects);
  renderInvested();
  renderGroups();
  renderModal();
  saveHash();
}

/* ======================================================== helpers =======
   Escaping, field lookup and the hints under the character fields. */
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// The six field rows replace the old selects. An unchosen field differs only
// by ink colour and an italic placeholder -- no badges, no counters.
function renderFields(){
  for (const f of CHOICE_FIELDS){
    const el = document.getElementById("f" + f[0].toUpperCase() + f.slice(1));
    if (!el) continue;
    const v = fieldDisplay(f);
    el.textContent = v || "not chosen";
    el.classList.toggle("unset", !v);
  }
  // Survival is only offered when the modlist actually ships it.
  const srow = document.getElementById("survivalRow");
  if (srow){
    srow.hidden = !SURVIVAL;
    if (SURVIVAL){
      const box = document.getElementById("survival");
      if (box) box.checked = !!S.survival;
      srow.classList.toggle("on", !!S.survival);
      document.getElementById("survivalLabel").textContent =
        S.survival ? "On" : "Off";
      document.getElementById("survivalHint").textContent = S.survival
        ? `-${SURVIVAL.carryWeightPenalty} carry weight`
        : `costs ${SURVIVAL.carryWeightPenalty} carry weight`;
    }
  }

  // The masthead is fixed; the name goes in the browser title bar, so a tab
  // or a bookmark identifies the character without the page losing its name.
  document.title = S.name
    ? `Dragonborn Forge - ${S.name}`
    : "Dragonborn Forge";
}

/* ========================================================== chooser ======
   One component, five data-driven configs (plus "name", which is a text field
   rather than a list). Each config says how to get the options, how to read an
   option's id and label, and how to render its detail pane. All six fields --
   including the name, which is a text box rather than a list -- go through it.
========================================================================= */
const FIELDS = {
  name: {
    label: "Name", title: "Name your character",
    optional: true, text: true,
  },
  race: {
    label: "Race", title: "Choose a race",
    list: () => C.races, id: r => r.editorId, name: r => r.name,
    detail: r => detailRace(r),
  },
  cls: {
    label: "Class", title: "Choose a class",
    list: () => C.classes, id: c => c.class, name: c => c.class,
    detail: c => detailClass(c),
  },
  trait: {
    label: "Trait", title: "Choose a trait",
    optional: true,
    list: () => C.traits || [], id: t => t.trait, name: t => t.name,
    detail: t => detailTrait(t),
  },
  stone: {
    label: "Standing Stone", title: "Choose a standing stone",
    optional: true,
    list: () => C.standingStones, id: s => s.editorId, name: s => s.name,
    detail: s => detailStone(s),
  },
  deity: {
    label: "Devotion", title: "Choose a devotion",
    optional: true,
    list: () => R.deities, id: d => d.deity, name: d => d.name,
    tag: d => d.type,
    detail: d => detailDeity(d),
  },
};

// Current committed value of a field.
const fieldValue = f => f === "name" ? S.name : S[f];
// The chosen record for a field, or null.
function fieldRecord(f, id){
  const cfg = FIELDS[f];
  if (!cfg || !cfg.list) return null;
  return cfg.list().find(x => cfg.id(x) === id) || null;
}
// Display text for a field's current value.
function fieldDisplay(f){
  const v = fieldValue(f);
  if (!v) return "";
  if (f === "name") return v;
  const rec = fieldRecord(f, v);
  return rec ? FIELDS[f].name(rec) : v;
}

/* ---------------------------------------------------------- detail panes */
const fmtSigned = n => (n > 0 ? "+" : "") + n;

function detailRace(r){
  if (!r) return `<p class="empty">No race chosen.</p>`;
  let h = `<h4>${esc(r.name)}</h4>`;
  if (r.description) h += `<p class="desc">${esc(strip(r.description))}</p>`;
  if ((r.powers || []).length){
    h += `<div class="sect">Powers</div>`;
    h += r.powers.map(p => `<div class="sub"><b>${esc(p.name)}</b>`
      + `<span>${esc(strip(p.description || ""))}</span></div>`).join("");
  }
  // Carry weight is deliberately NOT shown here: it is identical across all
  // ten races, so repeating it in every pane said nothing about the choice.
  // The Attributes card reports the real total, survival penalty included.
  // The bonus perk point stays -- it genuinely differs (Imperial alone).
  if (r.bonusPerkPoints){
    h += `<div class="sect">Racial</div><div class="rows">`
       + row("Bonus perk points", fmtSigned(r.bonusPerkPoints), "up")
       + `</div>`;
  }
  // Aetherius gives races distinct stats, but ApprenticeAetherius.esp loads
  // later and normalizes them all. Say so, or a reader comparing races finds
  // nothing to compare and assumes the data is broken.
  if (r.normalizedBy){
    h += `<div class="foot">Every race in this modlist shares the same base
      attributes. <em>${esc(r.normalizedBy)}</em> normalizes them. Racial
      differences come from powers, not from starting stats.</div>`;
  }
  return h;
}

function detailClass(c){
  if (!c) return `<p class="empty">No class chosen.</p>`;
  // A class has no description field -- its skill floors ARE its description,
  // and because mastery perks gate at 10, they decide which trees open at
  // level 1. So they lead the pane instead of sitting under empty prose.
  let h = `<h4>${esc(c.class)}</h4>`;
  if ((c.skills || []).length){
    h += `<p class="desc">Sets these skills at creation. Mastery perks unlock at
          10, so a class decides which trees you can open straight away.</p>`;
    h += `<div class="rows">` + c.skills.map(s =>
      row(`${esc(s.skill)}${s.rank === "major" ? " <em>major</em>" : ""}`, s.level)
    ).join("") + `</div>`;
  }
  if ((c.effects || []).length){
    h += `<div class="sect">Effects</div>`;
    h += c.effects.map(e => `<div class="sub"><b>${esc(e.name)}</b>`
      + `<span>${esc(strip(e.description || ""))}</span></div>`).join("");
  }
  return h;
}

function detailTrait(t){
  if (!t) return `<p class="empty">No trait chosen.</p>`;
  let h = `<h4>${esc(t.name)}</h4>`;
  if (t.description) h += `<p class="desc">${esc(strip(t.description))}</p>`;
  if (t.grantsPower){
    h += `<div class="sect">Grants a power</div>`
      + `<div class="sub"><b>${esc(t.grantsPower)}</b></div>`;
  }
  if (t.bonusPerkPoints){
    h += `<div class="sect">Bonus</div><div class="rows">`
      + row("Bonus perk points", fmtSigned(t.bonusPerkPoints), "up") + `</div>`;
  }
  return h;
}

function detailStone(s){
  if (!s) return `<p class="empty">No standing stone chosen.</p>`;
  let h = `<h4>${esc(s.name)}</h4>`;
  if (s.description) h += `<p class="desc">${esc(strip(s.description))}</p>`;
  // A stone can change which devotion variant is in effect.
  const dt = R.deities.find(x => x.deity === S.deity);
  if (isStoneVaried(dt)){
    const dv = deityDevotion(dt, s.editorId);
    h += `<div class="sect">With your devotion</div>`
      + `<div class="sub"><b>${esc(dt.name)}</b><span>${esc(strip(dv
          ? dv.description : ""))}</span></div>`;
  }
  return h;
}

function detailDeity(d){
  if (!d) return `<p class="empty">No devotion chosen.</p>`;
  const dv = deityDevotion(d, S.stone);
  const unresolved = deityVariantUnresolved(d, S.stone);
  let h = `<h4>${esc(d.name)}</h4>`;
  h += `<div class="rows"><div class="row"><span class="rk">Type</span>`
     + `<span class="rv">${esc(d.type)}${d.type === "Daedra"
        ? " (double-edged)" : ""}</span></div></div>`;
  if (dv){
    h += `<div class="sect">Devotion (permanent)</div>`
      + `<div class="sub"><b>${esc(dv.name)}</b>`
      + `<span>${esc(strip(dv.description || ""))}</span></div>`;
    if (isStoneVaried(d)){
      const stone = C.standingStones.find(x => x.editorId === S.stone);
      h += unresolved
        ? `<div class="foot">This devotion changes with your standing stone
           (${d.variants.length} variants). No stone is chosen yet, so the base
           effect is shown.</div>`
        : `<div class="foot">Shown as <em>${esc(stoneWord(stone))}</em>: this
           devotion changes with your standing stone.</div>`;
    }
  }
  if (d.blessing){
    h += `<div class="sect">Shrine blessing (temporary, 8h)</div>`
      + `<div class="sub"><b>${esc(d.blessing.name)}</b>`
      + `<span>${esc(strip(d.blessing.description || ""))}</span></div>`
      + `<div class="foot">Blessings are temporary, so they are listed but kept
         out of the derived totals.</div>`;
  }
  return h;
}

const row = (k, v, cls) =>
  `<div class="row"><span class="rk">${k}</span>`
  + `<span class="rv${cls ? " " + cls : ""}">${esc(v)}</span></div>`;

/* renderPreview() removed: the chooser shows description / powers /
   effects only. A live now->next stat diff sat under every option, but
   races in this modlist are normalized flat, so it read 100 -> 100 on
   almost every row and added height without adding information. */

// The hints under each select used to repeat the full effect text, which the
// Active Effects panel already lists verbatim -- two of them alone were 196px
// of duplicated prose. Each hint now carries only what that panel does NOT
// say: the class's skill floors, and the fact that a devotion has stone
// variants. Everything descriptive lives in Active Effects.
function renderHints(){
  const c = C.classes.find(x => x.class === S.cls);
  // Class skills SET the skill to that value at creation -- they are a floor,
  // not a bonus on top of the base 5. This is the one thing no other panel
  // says, so it is the only hint kept under the selects; everything else the
  // hints used to repeat is listed verbatim in Active Effects.
  document.getElementById("clsHint").innerHTML = c && c.skills && c.skills.length
    ? c.skills.map(s => `<em>${esc(s.skill)} ${s.level}</em>`).join(", ")
    : "";

  // The devotion hint now says which variant is actually in effect, rather
  // than only counting them.
  const dt = R.deities.find(x => x.deity === S.deity);
  const hint = document.getElementById("deityHint");
  if (!isStoneVaried(dt)){
    hint.textContent = "";
  } else if (deityVariantUnresolved(dt, S.stone)){
    hint.textContent = `varies by standing stone (${dt.variants.length}), none chosen`;
  } else {
    const stone = C.standingStones.find(x => x.editorId === S.stone);
    hint.textContent = `as ${stoneWord(stone)}, varies by standing stone`;
  }
}
// Descriptions carry <50>-style runtime placeholders; show the number plainly.
const strip = s => String(s || "").replace(/<(\d+)>/g, "$1");

/* -------------------------------------------------- chooser: rendering -- */
// A filter box only earns its space on the long lists (32 traits, 45 deities).
const NEEDS_FILTER = 15;

function chooserOptions(field){
  const cfg = FIELDS[field];
  if (!cfg.list) return [];
  let items = cfg.list().slice();
  const q = CH.filter.trim().toLowerCase();
  if (q) items = items.filter(x => cfg.name(x).toLowerCase().includes(q));
  return items;
}

// Would committing this pick leave the build spending more than it has?
// Class and stone changes are safe: skill levels DERIVE from the perks bought
// (classSkillFloor is a floor, never a cap) and canBuy never gates on skill
// level, so no purchase can be orphaned. Only the two +1 bonuses -- Imperial
// and Faithless -- can shrink the budget below what is already committed.
//
// Nothing is refunded when this happens. The dialog says the build will be
// over budget and lets the user proceed anyway; the perks stay bought.
function pickCost(field, pickId){
  if (field !== "race" && field !== "trait") return null;
  const after = pointsAvailable(withField(field, pickId));
  const spent = pointsSpent();
  if (spent <= after) return null;
  return {over: spent - after, before: pointsAvailable(S), after, spent};
}

/* What a reset would actually destroy, so the dialog can say it rather than
   asking "are you sure?" about nothing in particular. */
function resetImpact(){
  const chosen = CHOICE_FIELDS.filter(f => fieldValue(f));
  const spent = pointsSpent();
  const trees = P.skills.filter(s => s.perks.some(p => S.ranks.get(p.formId))).length;
  return {
    chosen, spent, trees, picks: S.picks.length, level: S.level,
    // Nothing to lose: no choices, no perks, no level-ups, still level 1.
    empty: !chosen.length && !spent && !S.picks.length && S.level === 1,
  };
}

function renderChooser(){
  const modal = document.getElementById("cmodal");
  const sheet = document.getElementById("csheet");

  // The reset confirmation borrows this modal. It is checked first so it can
  // sit on top of nothing else -- reset is only reachable from the masthead.
  if (ASK.open){
    const im = resetImpact();
    const bits = [];
    if (im.chosen.length) bits.push(`${im.chosen.length} character choice${
      im.chosen.length === 1 ? "" : "s"}`);
    if (im.spent) bits.push(`${im.spent} perk point${im.spent === 1 ? "" : "s"}`
      + ` across ${im.trees} tree${im.trees === 1 ? "" : "s"}`);
    if (im.picks) bits.push(`${im.picks} level-up choice${im.picks === 1 ? "" : "s"}`);
    if (im.level > 1) bits.push(`level ${im.level}`);

    sheet.innerHTML = `
      <header>
        <h3 id="cTitle">Reset this build?</h3>
        <button class="close" data-askno aria-label="Cancel">&times;</button>
      </header>
      <div class="cask">
        <p>This clears everything back to an empty character. It cannot be undone.</p>
        ${bits.length
          ? `<p class="lose"><b>You will lose:</b> ${esc(bits.join(" · "))}.</p>`
          : `<p class="lose empty">There is nothing to lose. This build is already empty.</p>`}
        <p class="keep">Your build link stays in the address bar until the page
           is reloaded, so a copied link still works.</p>
      </div>
      <div class="nav">
        <button class="chip" data-askno>Cancel</button>
        <span class="right">
          <button class="chip danger" data-askyes>Reset build</button>
        </span>
      </div>`;
    sheet.classList.add("ask");
    modal.classList.add("show");
    syncScrollLock();
    return;
  }

  sheet.classList.remove("ask");

  if (!CH.field){
    modal.classList.remove("show");
    sheet.innerHTML = "";
    syncScrollLock();
    return;
  }

  const field = CH.field, cfg = FIELDS[field];

  const head = `<header>
    <h3 id="cTitle">${esc(cfg.title)}</h3>
    <button class="close" data-cclose aria-label="Close">&times;</button>
  </header>`;

  /* body */
  let body;
  if (cfg.text){
    body = `<div class="cname">
      <input id="cNameInput" type="text" maxlength="40" autocomplete="off"
             spellcheck="false" placeholder="Unnamed"
             value="${esc(CH.pick)}" aria-label="Character name">
      <div class="sub">You can leave this blank and name your character later.</div>
    </div>`;
  } else {
    const items = chooserOptions(field);
    const cur = fieldValue(field);
    const showFilter = cfg.list().length >= NEEDS_FILTER;
    let listHtml = showFilter
      ? `<div class="cfilter"><input id="cFilter" type="text" autocomplete="off"
           placeholder="Filter ${esc(cfg.label.toLowerCase())}…"
           value="${esc(CH.filter)}" aria-label="Filter options"></div>`
      : "";
    if (cfg.optional){
      listHtml += `<button class="copt${CH.pick === "" ? " on" : ""}" data-opt="">`
        + `<span>none</span>`
        + (cur === "" ? `<span class="cur">✦</span>` : "") + `</button>`;
    }
    listHtml += items.map(x => {
      const id = cfg.id(x);
      return `<button class="copt${id === CH.pick ? " on" : ""}"
        data-opt="${esc(id)}"><span>${esc(cfg.name(x))}</span>`
        + (id === cur ? `<span class="cur">✦</span>`
           : cfg.tag ? `<span class="tag">${esc(cfg.tag(x))}</span>` : "")
        + `</button>`;
    }).join("");
    if (!items.length) listHtml += `<div class="cfilter"><span class="sub">No match.</span></div>`;

    const rec = CH.pick ? fieldRecord(field, CH.pick) : null;
    const detail = CH.pick === "" && cfg.optional
      ? `<h4>None</h4><p class="desc">No ${esc(cfg.label.toLowerCase())} chosen.</p>`
      : cfg.detail(rec);

    body = `<div class="cbody">
      <div class="clist" id="cList">${listHtml}</div>
      <div class="cdetail" id="cDetail">${detail}</div>
    </div>`;
  }

  /* Warning when this pick would leave the build over budget. Nothing is
     refunded; the build simply becomes invalid until the user fixes it. */
  const cost = cfg.text ? null : pickCost(field, CH.pick);
  const warn = cost
    ? `<div class="cwarn">Perk budget <b>${cost.before} → ${cost.after}</b>,
        but ${cost.spent} ${cost.spent === 1 ? "is" : "are"} already spent.
        This build will be <b>${cost.over} over budget</b> until you refund
        ${cost.over === 1 ? "a perk" : "some perks"} or pick the bonus back
        up. Nothing is removed for you.</div>`
    : "";

  /* footer */
  const canGo = cfg.optional || cfg.text || CH.pick !== "";
  const nav = `<div class="nav">
      <button class="chip" data-cclose>Cancel</button>
      <span class="right">
        <button class="chip go" data-commit ${canGo ? "" : "disabled"}>${
          cost && !CH.confirm ? "Choose anyway" : "Choose"}</button>
      </span></div>`;

  sheet.innerHTML = head + body + warn + nav;
  modal.classList.add("show");
  syncScrollLock();
}

/* ------------------------------------------------------ chooser: verbs -- */
function openChooser(field){
  CH.field = field;
  CH.filter = "";
  CH.confirm = false;
  CH.pick = fieldValue(field);
  CH.lastFocus = document.activeElement;
  renderChooser();
  focusChooser();
}

// Focus goes to the name box when there is one, otherwise the selected option
// so the arrow keys work immediately.
function focusChooser(){
  const inp = document.getElementById("cNameInput");
  if (inp){ inp.focus(); inp.select(); return; }
  const on = document.querySelector("#cList .copt.on") ||
             document.querySelector("#cList .copt");
  if (on){ on.focus(); scrollPickIntoView(); }
}
function scrollPickIntoView(){
  const on = document.querySelector("#cList .copt.on");
  if (on && on.scrollIntoView) on.scrollIntoView({block: "nearest"});
}

function closeChooser(){
  const back = CH.lastFocus;
  CH.field = ""; CH.confirm = false; CH.pick = ""; CH.filter = "";
  renderChooser();
  if (back && back.focus) back.focus();
  CH.lastFocus = null;
}

/* ------------------------------------------------- reset confirmation --- */
function askReset(){
  ASK.open = true;
  ASK.lastFocus = document.activeElement;
  renderChooser();
  // Focus Cancel, not the destructive button, so a stray Enter does nothing.
  const no = document.querySelector("#csheet .nav [data-askno]");
  if (no) no.focus();
}
function closeAsk(){
  const back = ASK.lastFocus;
  ASK.open = false;
  renderChooser();
  if (back && back.focus) back.focus();
  ASK.lastFocus = null;
}
function doReset(){
  S.ranks.clear(); S.picks = []; S.level = 1;
  clearChoices();
  S.skill = ""; S.open = "";
  setLevelControl(1);
  closeAsk();
  renderHints();
  render();
  // No flash: flash() styles as a warning, and six fields snapping back to
  // "not chosen" is its own confirmation that something happened.
}

// Write the highlighted pick into the build.
function commitPick(){
  const field = CH.field;
  if (!field) return;
  if (field === "name"){
    S.name = String(CH.pick || "").trim();
  } else {
    // Race and trait carry the two +1 bonuses, so either can leave the build
    // over budget. Nothing is refunded here: renderBudget() shows the
    // overspend and the user resolves it.
    S[field] = CH.pick;
  }
}

/* ============================================================= export ====
   Two renderings of one build summary: a plain-text block for pasting into
   Discord or a wiki, and a printable sheet for paper/PDF. Both are built from
   the same gathered model, so they cannot drift apart.
========================================================================= */

// Everything worth exporting, gathered once.
function buildSummary(){
  const effects = activeEffects();
  const a = attrTotal();
  const avail = pointsAvailable(), spent = pointsSpent();

  const trees = P.skills.map(s => {
    const picked = s.perks
      .filter(p => S.ranks.get(p.formId))
      .map(p => ({
        name: p.name,
        rank: S.ranks.get(p.formId),
        ranks: p.ranks,
        pts: S.ranks.get(p.formId),
      }));
    return picked.length ? {
      name: s.name, category: s.category, level: skillLevel(s),
      perks: picked, points: picked.reduce((n, p) => n + p.pts, 0),
    } : null;
  }).filter(Boolean);

  const dt = R.deities.find(x => x.deity === S.deity);
  const raceRec = C.races.find(x => x.editorId === S.race);
  const carryPen = survivalCarryPenalty(S);
  const carryBase = (raceRec && raceRec.carryWeight) || 0;
  const fx = fxTotals(effects);
  return {
    name: S.name || "Unnamed",
    survival: !!S.survival,
    survivalPenalty: carryPen,
    carry: carryBase ? carryBase + (fx.carry || 0) - carryPen : null,
    level: S.level,
    race: fieldDisplay("race") || "not chosen",
    cls: fieldDisplay("cls") || "not chosen",
    trait: fieldDisplay("trait") || "not chosen",
    stone: fieldDisplay("stone") || "not chosen",
    deity: fieldDisplay("deity") || "not chosen",
    deityVariant: isStoneVaried(dt) && !deityVariantUnresolved(dt, S.stone)
      ? stoneWord(C.standingStones.find(x => x.editorId === S.stone)) : "",
    attrs: a,
    picks: {h: attrCount("h"), m: attrCount("m"), s: attrCount("s")},
    pickOrder: S.picks.slice(),
    // The first level-up choice is worth double (level 2 grants 20, every
    // later level 10), so which attribute took it is a real build fact.
    firstPick: S.picks[0]
      ? {stat: {h: "Health", m: "Magicka", s: "Stamina"}[S.picks[0]],
         gain: (perLevel[1] || {}).healthPerChoice || 20,
         other: (perLevel[2] || {}).healthPerChoice || 10}
      : null,
    avail, spent, left: avail - spent,
    trees,
    // Perks are excluded here for the same reason they are excluded from the
    // Active Effects card: the sheet already lists every bought perk by tree,
    // so repeating them as prose would duplicate the largest section.
    // They still reach the totals via fxTotals(effects) above.
    effects: effects.filter(e => !e.hidden),
    modlist: P.modlist,
    url: location.href,
  };
}

// ---- plain text
function buildAsText(){
  const b = buildSummary();
  const L = [];
  const rule = "=".repeat(60);
  const thin = "-".repeat(60);
  L.push(rule);
  L.push(`  ${b.name.toUpperCase()}`);
  L.push(`  Level ${b.level} ${b.race} ${b.cls}`.replace(/\s+/g, " "));
  L.push(rule);
  L.push("");
  L.push("CHARACTER");
  L.push(thin);
  const pad = k => (k + " ".repeat(16)).slice(0, 16);
  L.push(`${pad("Name")}${b.name}`);
  L.push(`${pad("Level")}${b.level}`);
  L.push(`${pad("Race")}${b.race}`);
  L.push(`${pad("Class")}${b.cls}`);
  L.push(`${pad("Trait")}${b.trait}`);
  L.push(`${pad("Standing Stone")}${b.stone}`);
  L.push(`${pad("Devotion")}${b.deity}${b.deityVariant ? ` (as ${b.deityVariant})` : ""}`);
  if (b.survival) L.push(`${pad("Survival")}On (-${b.survivalPenalty} carry weight)`);
  L.push("");
  L.push("ATTRIBUTES");
  L.push(thin);
  L.push(`${pad("Health")}${b.attrs.h}`);
  L.push(`${pad("Magicka")}${b.attrs.m}`);
  L.push(`${pad("Stamina")}${b.attrs.s}`);
  if (b.carry != null){
    L.push(`${pad("Carry weight")}${b.carry}`
         + (b.survivalPenalty ? ` (survival -${b.survivalPenalty})` : ""));
  }
  L.push(`${pad("Level-ups")}${b.picks.h}H / ${b.picks.m}M / ${b.picks.s}S`
       + ` (${b.pickOrder.length} of ${attrAvail()})`);
  if (b.firstPick){
    L.push(`${pad("First choice")}${b.firstPick.stat}`
         + ` (+${b.firstPick.gain} instead of +${b.firstPick.other})`);
  }
  L.push("");
  L.push("PERKS");
  L.push(thin);
  L.push(`${pad("Points")}${b.spent} spent, ${b.left} remaining (of ${b.avail})`);
  if (!b.trees.length){
    L.push("");
    L.push("  No perks selected.");
  }
  for (const cat of ["Combat", "Magic", "Stealth"]){
    const inCat = b.trees.filter(t => t.category === cat);
    if (!inCat.length) continue;
    L.push("");
    L.push(`${cat.toUpperCase()}`);
    for (const t of inCat){
      L.push(`  ${t.name}: level ${t.level}, ${t.points} pt${t.points === 1 ? "" : "s"}`);
      for (const p of t.perks){
        L.push(`      ${p.name}${p.ranks > 1 ? ` (${p.rank}/${p.ranks})` : ""}`);
      }
    }
  }
  if (b.effects.length){
    L.push("");
    L.push("ACTIVE EFFECTS");
    L.push(thin);
    let src = "";
    for (const e of b.effects){
      if (e.source !== src){ src = e.source; L.push(`  [${src}]`); }
      // Wrap the description so the block stays inside 60 columns.
      const head = `    ${e.label}: `;
      const words = e.text.split(/\s+/);
      let line = head;
      const out = [];
      for (const w of words){
        if ((line + w).length > 74){ out.push(line); line = "      " + w + " "; }
        else line += w + " ";
      }
      out.push(line);
      out.forEach(x => L.push(x.replace(/\s+$/, "")));
    }
  }
  L.push("");
  L.push(thin);
  L.push(`${b.modlist} · generated by Dragonborn Forge`);
  L.push(b.url);
  return L.join("\n");
}

// ---- printable sheet
function buildAsPrintHTML(){
  const b = buildSummary();
  const e = esc;
  const row = (k, v) => v && v !== "not chosen"
    ? `<tr><th>${e(k)}</th><td>${e(v)}</td></tr>` : "";

  const cats = ["Combat", "Magic", "Stealth"].map(cat => {
    const inCat = b.trees.filter(t => t.category === cat);
    if (!inCat.length) return "";
    return `<section class="cat"><h3>${e(cat)}</h3>` + inCat.map(t =>
      `<div class="tree">
         <div class="th"><b>${e(t.name)}</b>
           <span>level ${t.level} · ${t.points} pt${t.points === 1 ? "" : "s"}</span></div>
         <ul>${t.perks.map(p =>
           `<li>${e(p.name)}${p.ranks > 1
             ? ` <i>${p.rank}/${p.ranks}</i>` : ""}</li>`).join("")}</ul>
       </div>`).join("") + `</section>`;
  }).join("");

  let fx = "", src = "";
  for (const x of b.effects){
    if (x.source !== src){
      if (src) fx += `</dl>`;
      src = x.source;
      fx += `<h4>${e(src)}</h4><dl>`;
    }
    fx += `<dt>${e(x.label)}</dt><dd>${e(x.text)}</dd>`;
  }
  if (src) fx += `</dl>`;

  return `<!doctype html><html><head><meta charset="utf-8">
<title>${e(b.name)} character sheet</title>
<style>
  @page{margin:16mm}
  *{box-sizing:border-box}
  body{font:11pt/1.5 Georgia,"Times New Roman",serif;color:#111;background:#fff;
       margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h1{font-size:22pt;margin:0 0 2pt;letter-spacing:.02em}
  .sub{font-size:10pt;color:#555;margin:0 0 14pt;
       padding-bottom:8pt;border-bottom:2px solid #111}
  h2{font-size:11pt;letter-spacing:.14em;text-transform:uppercase;
     margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1px solid #bbb;
     color:#333;page-break-after:avoid}
  h3{font-size:10pt;letter-spacing:.12em;text-transform:uppercase;
     color:#444;margin:10pt 0 4pt;page-break-after:avoid}
  h4{font-size:9.5pt;letter-spacing:.1em;text-transform:uppercase;color:#666;
     margin:8pt 0 3pt;page-break-after:avoid}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-weight:normal;color:#666;width:34%;
     padding:2.5pt 0;vertical-align:top;font-size:10pt}
  td{padding:2.5pt 0;vertical-align:top}
  /* Two columns for the summary block, so the sheet opens compactly. */

// Print via a hidden iframe: a popup window is blocked from file:// in some
// browsers, and printing the live page would print the interactive UI.
function printBuild(){
  const old = document.getElementById("printFrame");
  if (old) old.remove();
  const f = document.createElement("iframe");
  f.id = "printFrame";
  f.setAttribute("aria-hidden", "true");
  f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open(); d.write(buildAsPrintHTML()); d.close();
  const go = () => {
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch{ flash("Could not open the print dialog."); }
  };
  // Give the iframe a tick to lay out before printing.
  if (d.readyState === "complete") setTimeout(go, 60);
  else f.onload = () => setTimeout(go, 60);
}

// Clipboard needs a secure context and this usually runs from file://, so fall
// back to the textarea + execCommand path the share button already uses.
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch{ ok = false; }
    ta.remove();
    return ok;
  }
}

/* ------------------------------------------------------------ hash i/o - */
function saveHash(){
  const picks = [...S.ranks.entries()].map(([f,r]) => r > 1 ? `${f}:${r}` : f).join(",");
  const parts = [
    `l${S.level}`,
    // The name is the only free text in a "|"-delimited format, so it is
    // encoded per-value. Encoding "|" and "#" is what matters; loadHash
    // decodes each value individually rather than the whole hash at once,
    // because decoding first would turn an encoded "|" back into a delimiter.
    S.name ? `n${encodeURIComponent(S.name)}` : "",
    S.race ? `r${S.race}` : "",
    S.cls ? `c${S.cls}` : "",
    S.trait ? `t${S.trait}` : "",
    S.stone ? `s${S.stone}` : "",
    S.deity ? `d${S.deity}` : "",
    S.survival ? "v1" : "",
    S.skill ? `k${S.skill}` : "",
    S.picks.length ? `a${S.picks.join("")}` : "",
    picks ? `p${picks}` : "",
  ].filter(Boolean);
  history.replaceState(null, "", "#" + parts.join("|"));
}

function loadHash(){
  // NOT decodeURIComponent'd up front: the hash is "|"-delimited and the name
  // may legitimately contain an encoded "|", which a whole-string decode would
  // turn back into a delimiter and split on. Split first, decode each value.
  const h = location.hash.slice(1);
  if (!h) return;
  const dec = v => { try { return decodeURIComponent(v); } catch { return v; } };
  for (const part of h.split("|")){
    const k = part[0], v = part.slice(1);
    if (k === "l") S.level = Math.max(1, Math.min(maxLevel, +v || 1));
    else if (k === "n") S.name = dec(v).slice(0, 40);
    else if (k === "r") S.race = dec(v);
    else if (k === "c") S.cls = dec(v);
    else if (k === "t") S.trait = dec(v);
    else if (k === "s") S.stone = dec(v);
    else if (k === "d") S.deity = dec(v);
    else if (k === "v") S.survival = v === "1";
    else if (k === "k") S.skill = dec(v);
    else if (k === "a"){
      // New form is an ordered string like "hhmsh"; the old "h-m-s" counts
      // are still accepted so existing links keep working.
      if (v.includes("-")){
        const [a,b,c] = v.split("-").map(Number);
        S.picks = [].concat(Array(a||0).fill("h"), Array(b||0).fill("m"),
                            Array(c||0).fill("s"));
      } else {
        S.picks = v.split("").filter(x => "hms".includes(x));
      }
    }
    else if (k === "p"){
      v.split(",").forEach(tok => {
        const [fid, r] = tok.split(":");
        if (PERK.has(fid)) S.ranks.set(fid, Math.max(1, +r || 1));
      });
    }
  }
}

/* ------------------------------------------------- chooser: events ----- */
function wireChooser(){
  const modal = document.getElementById("cmodal");

  modal.addEventListener("click", e => {
    // Reset confirmation owns the modal while it is open.
    if (ASK.open){
      if (e.target.closest("[data-askyes]")){ doReset(); return; }
      // Cancel, the X, or the scrim all back out.
      if (e.target.closest("[data-askno]") || e.target.closest("[data-cclose]")
          || e.target.classList.contains("scrim")){ closeAsk(); return; }
      return;
    }

    // Cancel / X / scrim.
    if (e.target.closest("[data-cclose]")){ closeChooser(); return; }

    // Pick an option: highlight only. Nothing is committed until Choose/Next,
    // which is what lets the detail pane preview consequences safely.
    const opt = e.target.closest("[data-opt]");
    if (opt){
      CH.pick = opt.dataset.opt;
      CH.confirm = false;
      renderChooser();
      const el = document.querySelector("#cList .copt.on");
      if (el) el.focus();
      return;
    }

    if (e.target.closest("[data-commit]")){
      // A pick that costs a perk point asks once before taking it.
      const cost = pickCost(CH.field, CH.pick);
      if (cost && !CH.confirm){
        CH.confirm = true;
        renderChooser();
        const btn = document.querySelector("#csheet [data-commit]");
        if (btn) btn.focus();
        return;
      }
      const over = cost ? cost.over : 0;
      commitPick();
      closeChooser();
      renderHints();
      render();
      if (over) flash(`Now ${over} perk point${over === 1 ? "" : "s"} over budget.`);
      return;
    }
  });

  // Typing in the name box or the filter.
  modal.addEventListener("input", e => {
    if (e.target.id === "cNameInput"){ CH.pick = e.target.value; return; }
    if (e.target.id === "cFilter"){
      CH.filter = e.target.value;
      renderChooser();
      const f = document.getElementById("cFilter");
      // Re-render replaces the input, so restore focus and caret.
      if (f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }
  });

  modal.addEventListener("keydown", e => {
    // The confirmation traps focus and Escape the same way, but has no list
    // to arrow through -- Escape cancels, which is the safe direction.
    if (ASK.open){
      if (e.key === "Escape"){ e.preventDefault(); closeAsk(); return; }
      if (e.key === "Tab") trapFocus(e, modal);
      return;
    }

    if (!CH.field) return;

    // Enter in the name box commits, rather than submitting nothing.
    if (e.target.id === "cNameInput" && e.key === "Enter"){
      e.preventDefault();
      commitPick(); closeChooser(); renderHints(); render();
      return;
    }

    // Arrow keys walk the option list; the detail pane and preview follow.
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      const opts = [...modal.querySelectorAll(".copt")];
      if (!opts.length) return;
      e.preventDefault();
      const i = opts.findIndex(o => o.classList.contains("on"));
      const n = e.key === "ArrowDown"
        ? Math.min(opts.length - 1, i + 1)
        : Math.max(0, i - 1);
      CH.pick = opts[n].dataset.opt;
      CH.confirm = false;
      renderChooser();
      const el = document.querySelector("#cList .copt.on");
      if (el) el.focus();
      scrollPickIntoView();
      return;
    }

    if (e.key === "Escape"){
      e.preventDefault();
      closeChooser();
      return;
    }

    // Focus trap. Absent on the tree modal, but the chooser is keyboard-driven
    // and Tab must not walk out into the page behind it.
    if (e.key === "Tab") trapFocus(e, modal);
  });
}

// Keep Tab inside `root`. Shared by the chooser and the reset confirmation.
function trapFocus(e, root){
  const f = [...root.querySelectorAll(
    'button:not([disabled]), input, [href], [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last){
    e.preventDefault(); first.focus();
  }
}

/* ------------------------------------------------------------- events -- */
function wire(){
  const lvl = document.getElementById("lvl");
  lvl.max = maxLevel;
  lvl.addEventListener("input", () => {
    S.level = +lvl.value;
    document.getElementById("lvlOut").textContent = S.level;
    // Dropping the level can leave perks or level-up choices unaffordable.
    // Nothing is refunded: render() reports the overspend and the user
    // decides whether to raise the level again or give something up.
    render();
  });

  // Field rows open their chooser. One handler for all six.
  document.getElementById("fieldrows").addEventListener("click", e => {
    const row = e.target.closest("[data-choose]");
    if (!row) return;
    openChooser(row.dataset.choose);
  });

  const sbox = document.getElementById("survival");
  if (sbox) sbox.addEventListener("change", e => {
    S.survival = e.target.checked;
    render();          // carry weight is derived, so a repaint is enough
  });

  wireChooser();

  document.querySelectorAll(".pick button").forEach(b => {
    b.addEventListener("click", () => {
      if (attrSpent() >= attrAvail()) return;
      S.picks.push(b.dataset.at); render();
    });
    b.addEventListener("contextmenu", e => {
      e.preventDefault();
      const k = b.dataset.at;
      const idx = S.picks.lastIndexOf(k);
      if (idx >= 0){ S.picks.splice(idx, 1); render(); }
    });
  });

  // Cards: click one to open its tree.
  const groups = document.getElementById("groups");
  groups.addEventListener("click", e => {
    const card = e.target.closest(".skillcard");
    if (!card) return;
    openSkill(card.dataset.skill);
  });

  // Perk click: left = buy next rank, right = refund one rank.
  const trees = document.getElementById("modal");
  const hit = e => {
    const g = e.target.closest(".pnode");
    if (!g) return null;
    return PERK.get(g.dataset.fid);
  };

  // Hover card: describes the perk and why it is or isn't takeable.
  const showTip = (g) => {
    const entry = PERK.get(g.dataset.fid);
    if (!entry) return;
    const {p, skill} = entry;
    const tip = document.getElementById("tip");
    if (!tip) return;
    const have = S.ranks.get(p.formId) || 0;
    const unmet = p.prerequisites.filter(q => !(S.ranks.get(q.formId) > 0));

    // Show every rank with its own text and gate, marking which you own and
    // which is next. Rank 2 usually restates the numbers rather than stacking,
    // so the difference is worth reading before spending a point.
    const descs = p.rankDescriptions || [p.description];
    const body = p.ranks > 1
      ? `<div class="ranks">` + descs.map((t, i) => {
          const owned = i < have, next = i === have;
          return `<div class="rk${owned ? " owned" : ""}${next ? " next" : ""}">`
               + `<span class="mark">${owned ? "●" : "○"}</span>`
               + `<span class="lv">${p.rankSkillLevels[i]}</span>`
               + `<span class="t">${esc(t)}</span></div>`;
        }).join("") + `</div>`
      : `<div class="d">${esc(descs[0])}</div>`;

    const gate = p.rankSkillLevels[Math.min(have, p.rankSkillLevels.length - 1)];
    const req = [`${esc(skill.name)} ${gate}`];
    if (p.ranks > 1) req.push(`rank ${have} of ${p.ranks}`);
    if (unmet.length && !prereqsMet(p)){
      const join = p.prerequisiteLogic === "any" ? " or " : " + ";
      req.push(`<span class="miss">needs ${unmet.map(q => esc(q.name)).join(join)}</span>`);
    }
    tip.innerHTML = `<b>${esc(p.name)}</b>${body}`
                  + `<div class="r">${req.join(" · ")}</div>`;


    // Fixed to the viewport, so it is never clipped by the tree card. Flip
    // above the node when there is not enough room below.
    tip.classList.add("show");
    const nb = g.getBoundingClientRect();
    const tb = tip.getBoundingClientRect();
    const gap = 10;
    let left = nb.left + nb.width / 2 - tb.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tb.width - 8));
    let top = nb.bottom + gap;
    if (top + tb.height > window.innerHeight - 8){
      top = nb.top - tb.height - gap;
      if (top < 8) top = Math.max(8, window.innerHeight - tb.height - 8);
    }
    tip.style.left = left + "px";
    tip.style.top  = top + "px";
  };
  const hideTips = hideTip;

  trees.addEventListener("mouseover", e => {
    const g = e.target.closest(".pnode");
    if (g) showTip(g);
  });
  trees.addEventListener("mouseout", e => {
    if (e.target.closest(".pnode")) hideTips();
  });
  trees.addEventListener("focusin", e => {
    const g = e.target.closest(".pnode");
    if (g) showTip(g);
  });
  trees.addEventListener("focusout", hideTips);

  // Left click and Enter/Space both buy; right click and Shift+Enter both
  // refund. Shared here so the two input paths cannot drift apart.
  const tryBuy = p => {
    // At max rank there is nothing to buy, so this does nothing. Removing is
    // the refund action's job; making buy double as a refund meant a mis-click
    // destroyed a finished perk.
    if ((S.ranks.get(p.formId) || 0) >= p.ranks) return;
    if (!prereqsMet(p)) return flash(`${p.name} needs ${prereqNames(p)}.`);
    if (pointsSpent() >= pointsAvailable())
      return flash(`No perk points left at level ${S.level}.`);
    hideTips();
    buy(p);
  };

  trees.addEventListener("click", e => {
    const entry = hit(e);
    if (entry) tryBuy(entry.p);
  });
  trees.addEventListener("contextmenu", e => {
    const entry = hit(e); if (!entry) return;
    e.preventDefault();
    hideTips();
    sell(entry.p);
  });
  trees.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const entry = hit(e); if (!entry) return;
    e.preventDefault();
    if (e.shiftKey) sell(entry.p); else tryBuy(entry.p);
  });

  // Modal: close via the X, the scrim, or Esc; switch trees via the nav chips.
  const modal = document.getElementById("modal");
  modal.addEventListener("click", e => {
    if (e.target.closest("[data-close]")){ closeModal(); return; }
    if (e.target.closest("[data-clear]")){
      const s = modalSkill();
      if (!s) return;
      const freed = clearTree(s);
      if (!freed) return;
      hideTip();
      afterSpend();
      flash(`Cleared ${s.name}: ${freed} point${freed === 1 ? "" : "s"} refunded.`);
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape" || !S.open) return;
    e.preventDefault();
    closeModal();
  });

  document.getElementById("attrReset").addEventListener("click", () => {
    if (!S.picks.length) return;
    S.picks = [];
    render();
  });

  // Reset clears every choice back to "not chosen". It is destructive and has
  // no undo, so it confirms first; doReset() does the work.
  document.getElementById("reset").addEventListener("click", askReset);

  // Pasting a build link while the page is already open changes only the hash,
  // which is a same-document navigation -- boot() never runs again, so the new
  // build would be silently ignored. Re-read it and re-render.
  window.addEventListener("hashchange", () => {
    S.ranks.clear();
    S.picks = [];
    // loadHash only overwrites what the hash names, so clear the fields first
    // or a link that omits a field would inherit the previous build's value.
    clearChoices();
    loadHash();
    setLevelControl(S.level);
    renderHints();
    render();
  });

  document.getElementById("share").addEventListener("click", async () => {
    saveHash();
    const btn = document.getElementById("share");
    const ok = await copyText(location.href);
    btn.textContent = ok ? "Link copied" : "Copy from address bar";
    setTimeout(() => btn.textContent = "Copy build link", 1800);
  });

  document.getElementById("printBuild").addEventListener("click", printBuild);

  document.getElementById("textBuild").addEventListener("click", async () => {
    const btn = document.getElementById("textBuild");
    const ok = await copyText(buildAsText());
    btn.textContent = ok ? "Copied" : "Copy failed";
    setTimeout(() => btn.textContent = "Copy as text", 1800);
  });
}

/* --------------------------------------------------------------- boot -- */
function boot(){
  loadHash();

  setLevelControl(S.level);

  document.getElementById("stamp").textContent =
    `${P.modlist} · ${P.learnablePerkCount} perks · ${L.totals.totalPerkPoints} points at level ${maxLevel}`;
  // Was the footer's left half. The interaction hint that sat on its right is
  // dropped -- the perk modal already spells out click/right-click.
  document.getElementById("rules").textContent =
    `Skill floor ${BASE_SKILL} · caps ${L.skillCaps[0].skillCap} (formula ${L.skillCaps[0].formulaCap}) · legendary ${L.legendary.enabled ? "on" : "off"}`;

  renderHints();
  wire();
  render();
  // Nothing opens on load. Every field -- including race and class -- starts
  // at "not chosen" and is filled in by clicking its row, exactly like the
  // standing stone and the devotion. The page is browsable before any choice
  // is made, so the perk trees can be explored first.
}
boot();
