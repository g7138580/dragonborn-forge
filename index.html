<meta charset="utf-8">
<title>Dragonborn Forge</title>
<style>
/* ============================================================ tokens =====
   NORDIC UI styling, reproduced from the mod's own art. Two distinct palettes
   live in that mod and conflating them is the trap:

   * The MENU CHROME (panels, labels, borders) is strictly monochrome. That is
     what harvesting the .swf vector fills reports -- #000000 x375, #CCCCCC
     x275, #FFFFFF x98, #BCBEC0 x56 -- and it drives the card/panel tokens.
   * The CONSTELLATION is vividly coloured, and none of it lives in the SWFs:
     it comes from the DDS art (intfullnebulapanarama*, intperkstars01) plus
     Scaleform tinting.

   So the chrome is grey and the tree keeps its colour.
========================================================================= */
:root{
  --ground:#07080b;
  --surface:#101216;
  --surface-2:#181b20;
  --line:#282c33;
  --line-bright:#3b414a;
  --ink:#e9ebed;          /* near #FFFFFF, the mod's text colour */
  --ink-dim:#bcbec0;      /* #BCBEC0 -- straight from the SWF fills */
  --ink-faint:#7d8288;
  /* Historic name for a single semantic role: "chosen / owned / invested".
     Here it is the warm star-white of an owned perk. */
  --gold:#ffeec2;
  --gold-dim:#f5c96b;
  --gold-glow:rgba(245,201,107,.18);
  --locked:#3a3f45;
  --danger:#c05b52;
  --good:#8fa9a0;

  /* The three star states, taken from the in-game menu. Note the violet is
     LOCKED (requirements unmet), not merely unbought -- a buyable perk burns
     blue-white. Getting these two the wrong way round makes an unreachable
     perk look like the most inviting thing on screen. */
  --star-owned:#fff3d0;      /* bought: warm gold-white */
  --star-owned-halo:#f0b942;
  --star-avail:#dce8ff;      /* buyable now: cool blue-white */
  --star-avail-halo:#8fb4f0;
  --star-locked:#c77fe0;     /* requirements not met: violet */
  --star-locked-halo:#9a5ab8;
  --edge-line:#7fb8c8;       /* pale cyan connecting lines */

  /* Category hues, muted to cold steel so the three groups stay
     distinguishable without breaking the monochrome chrome. */
  --combat:#9aa3ab;
  --magic:#8f9db0;
  --stealth:#9c98ab;

  /* Sovngarde -- the face NORDIC UI is designed around -- ships as SWF glyph
     tables, not a .ttf, so it cannot be used here. It is a clean, widely
     spaced humanist serif rather than an inscriptional Roman, so the stack
     leans on Cambria/Constantia (present on Windows) before falling back.
     Letter-spacing does most of the work of matching its feel. */
  --f-display:"Sovngarde","Cambria","Constantia","Palatino Linotype",
              Georgia,"Times New Roman",serif;
  --f-body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-weight-display:500;

  --tree-bg:var(--tex-neb);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Type scale knob. Every font-size below is expressed in rem against this, so
   the whole UI scales from one number. rem resolves against the ROOT element,
   so it has to live on html -- setting it on body leaves rem on the browser's
   16px default. 15px was the original body size; this is 15 * 1.25. */
html{font-size:18.75px}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:1rem;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  /* A faint star field over the page ground, like the skill menu backdrop. */
  background-image:var(--tex-stars);
  background-size:520px;
  background-repeat:repeat;
  background-attachment:fixed;
}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ====================================================== page shell ======
   Outer layout: the centred column and the three-card top panel. */
.wrap{display:flex;flex-direction:column;gap:var(--s5);
      max-width:1400px;margin:0 auto;padding:var(--s5) var(--s5) var(--s6)}

/* Everything that used to live in the side rail, now one panel across the top.
   Three explicit columns rather than auto-fit: the cards have very different
   natural heights, and letting them flow left a ragged edge with a large hole
   on the right. Character (the only tall panel) takes the left column;
   Attributes and Invested stack in the middle; Active Effects sits right.
   align-items:start matters -- with stretch, every card grew to match the
   tallest in its row, so Derived rendered at 521px for 60px of content. */
.topbar{display:grid;gap:var(--s4);align-items:start;
        grid-template-columns:1.15fr 1fr 1.15fr}
.topbar .card{display:flex;flex-direction:column}
.topbar .col{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
@media(max-width:1100px){ .topbar{grid-template-columns:1fr 1fr} }
@media(max-width:760px){ .topbar{grid-template-columns:1fr} }

/* Active Effects is the one card worth stretching: it holds free-form text of
   unpredictable length, so filling the row's full height buys real reading
   room instead of the empty space every other card would gain. The rest keep
   align-items:start and end at their content. */
.topbar .fxcard{align-self:stretch}
.topbar .fxcard .fx{flex:1;max-height:none}

/* Invested scrolls rather than stretching its column. */
.inv{max-height:190px;overflow-y:auto}
.fx{overflow-y:auto}

/* ======================================================== masthead ======
   Title, perk-point budget, modlist stats and the build actions. */
.masthead{border-bottom:1px solid var(--line);
          padding-bottom:var(--s3);margin-bottom:0;
          display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap}
.masthead h1{font-size:1.7333rem;letter-spacing:.06em;text-transform:uppercase}
.masthead h1 span{color:var(--gold)}
.masthead .sub{color:var(--ink-faint);font-size:0.7333rem;letter-spacing:.04em;
               margin-left:auto;text-align:right;line-height:1.5}
.masthead .sub span{display:block}
.masthead .toolbar{flex:none}

/* budget, inline in the masthead ------------------------------------- */
.masthead .budget{display:flex;align-items:center;gap:var(--s3);
                  padding-left:var(--s4);border-left:1px solid var(--line)}
.masthead .budget .big{font-family:var(--f-display);font-size:1.8667rem;
                       line-height:1;color:var(--gold)}
.masthead .budget .big.over{color:var(--danger)}
.masthead .budget .of{display:flex;flex-direction:column;gap:2px;
                      font-size:0.7333rem;color:var(--ink-faint);
                      letter-spacing:.04em}
.masthead .budget .of b{font-size:0.6667rem;letter-spacing:.14em;
                        text-transform:uppercase;color:var(--ink-faint);
                        font-weight:600}
.masthead .budget .meter{display:block;width:120px;height:3px;
                         background:var(--ground);border:1px solid var(--line);
                         border-radius:99px;overflow:hidden}
.masthead .budget .note{font-size:0.7333rem;color:var(--ink-faint)}
.masthead .budget .note.warn{color:var(--danger)}

/* =========================================================== cards ======
   The panel cards: character fields, attributes, invested, effects. */

.card{background:var(--surface);border:1px solid var(--line);border-radius:0;
      padding:var(--s3) var(--s4) var(--s4)}
.card h2{font-size:0.7333rem;letter-spacing:.16em;text-transform:uppercase;
         color:var(--ink-faint);margin-bottom:var(--s2);font-weight:600}

/* The budget meter fill; the bar itself is sized in the masthead block above. */
.meter i{display:block;height:100%;background:var(--gold);
         transition:width .25s ease,background .25s ease}
.meter i.over{background:var(--danger)}

/* level slider ------------------------------------------------------- */
.lvl{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.lvl label{font-size:0.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.lvl output{font-family:var(--f-display);font-size:1.7333rem;color:var(--ink);margin-left:auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line-bright);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line-bright);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--gold);margin-top:-6px;border:2px solid var(--ground);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid var(--ground);
  border-radius:50%;background:var(--gold);cursor:pointer}

/* selects ------------------------------------------------------------ */
.field{margin-bottom:var(--s3)}
.field:last-child{margin-bottom:0}
/* Two columns of selects inside the Character card. */
.fields{display:grid;gap:var(--s3) var(--s3);
        grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fields .field{margin-bottom:0}
.field label{display:block;font-size:0.7333rem;letter-spacing:.13em;text-transform:uppercase;
             color:var(--ink-faint);margin-bottom:var(--s1)}
select{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--line);
       border-radius:2px;padding:7px var(--s2);cursor:pointer}
select:hover{border-color:var(--line-bright)}
.hint{font-size:0.8rem;color:var(--ink-dim);margin-top:var(--s2);line-height:1.45}
.hint em{color:var(--gold);font-style:normal}
/* The class skill floors, spanning the card under the selects. */
.hint.skills:not(:empty){margin-top:var(--s3);padding-top:var(--s3);
                         border-top:1px solid var(--line)}
.hint.skills:empty{display:none}

/* attributes --------------------------------------------------------- */
.attrs{display:flex;flex-direction:column;gap:var(--s2)}
.attr{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:var(--s3)}
.attr b{font-size:0.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.attr .bar{height:4px;background:var(--ground);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.attr .bar i{display:block;height:100%;transition:width .25s ease}
.attr .v{font-size:0.9333rem;min-width:42px;text-align:right}
.attr.h .bar i{background:#8d5a52}.attr.m .bar i{background:var(--magic)}.attr.s .bar i{background:var(--good)}
.pick{display:flex;gap:var(--s1);margin-top:var(--s2)}
.pick button{flex:1;border:1px solid var(--line);border-radius:2px;padding:5px 0;
             font-size:0.7333rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);
             background:var(--ground);transition:border-color .15s,color .15s}
.pick button:hover:not(:disabled){border-color:var(--gold-dim);color:var(--ink)}
.pick button:disabled{opacity:.3;cursor:not-allowed}
/* All level-ups spent. NOT `disabled` -- a disabled button swallows the
   contextmenu event, which would make the choice impossible to take back.
   This dims the buy affordance while leaving right-click alive. */
.pick button.full{opacity:.45}
.pick button.full:hover{border-color:var(--line);color:var(--ink-faint)}
/* The first level-up choice is worth double (20 vs 10). There is no badge on
   the row or the button -- the attribute row is a tight 3-column grid and a
   superscript there collided with the bar. The summary line under the buttons
   carries it instead, along with the value tooltip. */
.pick .cnt{color:var(--gold)}
.lvlrow{display:flex;align-items:center;justify-content:space-between;
        gap:var(--s2);margin-top:var(--s2)}
.lvlups{font-size:0.8rem;color:var(--ink-faint)}
/* More choices taken than the level allows. Nothing is auto-removed, so the
   invalid state has to be visible. */
.lvlups.over{color:var(--danger);font-weight:600}
.mini{font-size:0.7333rem;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-faint);border:1px solid var(--line);border-radius:2px;
      padding:3px var(--s2);background:var(--ground);
      transition:border-color .15s,color .15s}
.mini:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.mini:disabled{opacity:.35;cursor:not-allowed}

/* derived stats: a continuation of the attributes card ---------------- */
.derived:not(:empty){display:grid;grid-template-columns:1fr auto;
         gap:4px var(--s3);font-size:0.8667rem;
         margin-top:var(--s3);padding-top:var(--s3);
         border-top:1px solid var(--line)}
/* Empty means "nothing to say" -- collapse instead of printing a placeholder. */
.derived:empty{display:none}
.derived .k{color:var(--ink-dim)}
.derived .v{text-align:right;color:var(--ink)}
.derived .v.bonus{color:var(--gold)}

/* active effects ----------------------------------------------------- */
.fx{display:flex;flex-direction:column;gap:var(--s3)}
.fx .grp{display:flex;flex-direction:column;gap:3px}
.fx .grp > b{font-size:0.6667rem;letter-spacing:.13em;text-transform:uppercase;
             color:var(--ink-faint);font-weight:600}
.fx .grp > span{font-size:0.8333rem;color:var(--ink-dim);line-height:1.45}
.fx .grp > span em{color:var(--gold);font-style:normal}
.fx .grp > b i{font-style:normal;color:var(--ink-faint);letter-spacing:.05em}
/* A chosen-but-unmet effect: shown so the choice is visible, dimmed and
   labelled so it is obviously not counted in the totals. */
.fx .grp > span.inactive{opacity:.55}
.fx .grp > span.inactive em{color:var(--ink-dim)}
.fx .grp > span .warn{color:var(--danger);font-size:0.7333rem;
                      font-weight:600;letter-spacing:.04em}
.fx .none{color:var(--ink-faint);font-size:0.8667rem;font-style:italic}

/* invested ----------------------------------------------------------- */
.inv{display:flex;flex-direction:column;gap:6px}
.inv .row{display:flex;justify-content:space-between;gap:var(--s2);font-size:0.8667rem}
.inv .row b{font-weight:500;color:var(--ink-dim)}
.inv .row span{color:#ffffff}
.inv .none{color:var(--ink-faint);font-size:0.8667rem;font-style:italic}

/* ================================================ buttons and chips =====
   Toolbar buttons, skill cards and the perk-tree card shell. */
.toolbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:0;padding:5px var(--s3);
      font-size:0.8rem;letter-spacing:.06em;color:var(--ink-dim);background:var(--surface);
      transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--line-bright);color:var(--ink)}
.chip[aria-pressed=true]{border-color:var(--gold-dim);color:var(--gold);background:var(--gold-glow)}
.chip.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip:disabled:hover{border-color:var(--line);color:var(--ink-dim)}

/* skill cards -------------------------------------------------------- */
/* One card per skill, grouped into the three category sections. The card is
   the resting state; the constellation tree lives in a modal behind it. */
.group{margin-bottom:var(--s6)}
.group:last-child{margin-bottom:0}
.grouphead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);
           padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.grouphead .cat{width:3px;height:20px;border-radius:2px;flex:none}
.group.combat  .grouphead .cat{background:var(--combat)}
.group.magic   .grouphead .cat{background:var(--magic)}
.group.stealth .grouphead .cat{background:var(--stealth)}
.grouphead h2{font-family:var(--f-display);font-size:1.0rem;letter-spacing:.16em;
              text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.grouphead .tally{margin-left:auto;font-size:0.8rem;color:var(--ink-faint);
                  letter-spacing:.06em}
.grouphead .tally b{color:#ffffff;font-weight:600;font-variant-numeric:tabular-nums}

/* Fixed 3 across: every category holds exactly 6 skills, so this lands as a
   tidy 2x3 block per section rather than reflowing with the window. Collapses
   on narrow screens, where 3 columns would squeeze the perk lists. */
.cards{display:grid;gap:var(--s4);grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){ .cards{grid-template-columns:repeat(2,1fr)} }
@media(max-width:680px){ .cards{grid-template-columns:1fr} }

/* The card grid is grey chrome, so "invested" cannot be carried by hue the way
   the tree does it. A lit left edge plus a lifted surface says it structurally
   and survives at a glance. */
.skillcard{display:flex;flex-direction:column;gap:var(--s3);text-align:left;
  background:#0e1013;border:1px solid var(--line);border-radius:0;
  border-left:3px solid transparent;
  padding:var(--s4);width:100%;
  transition:border-color .15s,background .15s,transform .15s}
.skillcard:hover{border-color:var(--line-bright);background:var(--surface-2);
                 transform:translateY(-1px)}
.skillcard.invested{border-color:var(--line-bright);
                    border-left-color:#ffffff;background:#15181c}
.skillcard.invested:hover{border-color:var(--ink-dim);border-left-color:#ffffff}

.skillcard .top{display:flex;align-items:baseline;gap:var(--s2)}
.skillcard h3{font-size:1.0667rem;letter-spacing:.04em;color:var(--ink)}
.skillcard.invested h3{color:#ffffff}
.skillcard .lv{margin-left:auto;text-align:right;line-height:1.15;flex:none}
.skillcard .lv b{display:block;font-family:var(--f-display);font-size:1.2667rem;
                 color:var(--ink-faint)}
.skillcard.invested .lv b{color:#ffffff}
.skillcard .lv b.base{color:var(--ink-faint)}
.skillcard .lv i{font-style:normal;font-size:0.6333rem;letter-spacing:.11em;
                 text-transform:uppercase;color:var(--ink-faint)}

/* The chosen perks -- the whole point of the card. */
.chosen{display:flex;flex-direction:column;gap:5px;min-height:20px}
.chosen .p{display:flex;align-items:baseline;gap:var(--s2);font-size:0.8333rem;
           color:var(--ink-dim);line-height:1.35}
/* A small diamond, echoing the mod's list markers. */
.chosen .p .bullet{width:4px;height:4px;border-radius:0;background:var(--gold);
                   flex:none;transform:translateY(-2px) rotate(45deg)}
.chosen .p .rk{margin-left:auto;font-size:0.6667rem;color:var(--ink-faint);
               font-variant-numeric:tabular-nums;flex:none}
.chosen .none{font-size:0.8rem;color:var(--ink-faint);font-style:italic}

.skillcard .foot{display:flex;align-items:center;gap:var(--s2);
                 margin-top:auto;padding-top:var(--s2);
                 border-top:1px solid var(--line);
                 font-size:0.7333rem;letter-spacing:.08em;text-transform:uppercase;
                 color:var(--ink-faint)}
.skillcard .foot .pts{color:var(--ink-faint);font-variant-numeric:tabular-nums}
.skillcard.invested .foot .pts{color:#ffffff}
.skillcard .foot .open{margin-left:auto;color:var(--ink-faint);transition:color .15s}
.skillcard:hover .foot .open{color:var(--gold)}

/* =========================================================== modal ======
   Shared dialog shell: scrim, sheet, header, footer nav. */
.modal{position:fixed;inset:0;z-index:300;display:none;
       align-items:flex-start;justify-content:center;
       padding:var(--s4);overflow-y:auto}
.modal.show{display:flex}
.modal .scrim{position:fixed;inset:0;background:rgba(6,7,11,.72)}
/* Fill the viewport without exceeding it: the sheet is exactly as tall as the
   window, and the canvas takes whatever height the header and footer leave.
   Height is *capped* rather than merely set, so the tree never overflows into
   a scroll -- the whole tree should be visible at once. */
.modal .sheet{position:relative;z-index:1;width:100%;max-width:1600px;border-radius:0;
  height:calc(100vh - var(--s4) * 2);
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line-bright);border-radius:3px;
  box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal .sheet > header{display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);
  background:var(--surface-2);position:sticky;top:0;z-index:2}
.modal .sheet > header .cat{width:3px;height:26px;border-radius:2px;flex:none}
.modal .sheet.combat  > header .cat{background:var(--combat)}
.modal .sheet.magic   > header .cat{background:var(--magic)}
.modal .sheet.stealth > header .cat{background:var(--stealth)}
.modal .sheet h3{font-size:1.1333rem;letter-spacing:.05em}
.modal .sheet .lv{text-align:right;line-height:1.2;margin-left:var(--s3)}
.modal .sheet .lv b{display:block;font-family:var(--f-display);font-size:1.2667rem;color:var(--gold)}
.modal .sheet .lv b.base{color:var(--ink-faint)}
.modal .sheet .lv i{font-style:normal;font-size:0.6667rem;letter-spacing:.11em;
                    text-transform:uppercase;color:var(--ink-faint)}
/* Budget stays visible while spending -- it is the constraint being managed. */
.modal .bank{margin-left:auto;text-align:right;line-height:1.2}
.modal .bank b{display:block;font-family:var(--f-display);font-size:1.2667rem;color:var(--gold)}
.modal .bank b.over{color:var(--danger)}
.modal .bank i{font-style:normal;font-size:0.6667rem;letter-spacing:.11em;
               text-transform:uppercase;color:var(--ink-faint)}
.modal .close{font-size:1.4667rem;line-height:1;color:var(--ink-faint);
              padding:0 var(--s2);transition:color .15s}
.modal .close:hover{color:var(--ink)}
.modal .note{padding:0 var(--s4) var(--s3);font-size:0.8rem;color:var(--ink-faint);
             min-height:1.2em;text-align:center}
.modal .note.warn{color:var(--danger)}
.modal .nav{display:flex;align-items:center;
            padding:var(--s2) var(--s4) var(--s3);
            border-top:1px solid var(--line)}
.modal .sheet > header{flex-wrap:wrap}
.modal .sheet > header h3{margin-right:var(--s2)}
.modal .nav .hintkeys{margin-left:auto;font-size:0.7333rem;color:var(--ink-faint);
                      letter-spacing:.05em;text-transform:none}
/* ========================================================= chooser ======
   The six character-field rows and the picker dialog they open. An unchosen
   row differs from a chosen one only by ink colour, which is the whole
   affordance. */
.fieldrows{display:flex;flex-direction:column;margin-top:var(--s3);
           border-top:1px solid var(--line)}
.fieldrow{display:flex;align-items:baseline;gap:var(--s3);width:100%;
          text-align:left;padding:var(--s2) var(--s1);
          border-bottom:1px solid var(--line);transition:background .12s}
.fieldrow:hover{background:var(--surface-2)}
.fieldrow .k{flex:none;width:8.2rem;font-size:0.7333rem;letter-spacing:.13em;
             text-transform:uppercase;color:var(--ink-faint)}
.fieldrow .v{flex:1;min-width:0;color:var(--ink)}
.fieldrow .v.unset{color:var(--ink-faint);font-style:italic}
/* The disclosure caret is generated, so the six rows carry no repeated markup.
   `order` keeps it last on the FIRST line: the devotion row wraps its hint to
   a second line, and without this the caret is what wraps instead, leaving a
   stray "›" sitting alone under the row. */
.fieldrow::after{content:"›";flex:none;color:var(--ink-faint);
                 font-size:1.1rem;line-height:1;order:1}
.fieldrow:hover::after{color:var(--gold-dim)}
.fieldrow{flex-wrap:wrap}
/* The hint takes a full second line, but only when it actually has text --
   an empty one must not add height to the row. */
.fieldrow .hint{order:2;flex-basis:100%;margin:0 0 0 8.2rem;
                font-size:0.7333rem}
.fieldrow .hint:empty{display:none}
/* The survival row is a checkbox, not a chooser: no caret, and the whole row
   is the label so the click target matches the other five. */
.fieldrow.toggle{cursor:pointer}
.fieldrow.toggle::after{content:none}
.fieldrow.toggle[hidden]{display:none}
.fieldrow.toggle .v{display:flex;align-items:center;gap:var(--s2)}
.fieldrow.toggle input{accent-color:var(--gold-dim);width:15px;height:15px;
                       margin:0;cursor:pointer}
.fieldrow.toggle .v span{color:var(--ink-faint)}
.fieldrow.toggle.on .v span{color:var(--ink)}
/* A survival penalty is a subtraction, so it reads in the danger colour --
   the same encoding the perk-budget warning uses. */
.derived .pen{color:var(--danger)}
.derived .sub{font-size:0.7333rem;color:var(--ink-faint)}

/* The chooser sheet is sized to its content, unlike the tree sheet which is
   pinned to the viewport -- a 10-item race list should not be 100vh tall. */
.modal.chooser .sheet{height:auto;max-height:calc(100vh - var(--s4)*2);
                      max-width:1080px}
.modal.chooser .sheet h3{margin-right:auto}
.cbody{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);
       min-height:0;flex:1;overflow:hidden}
@media(max-width:820px){
  .cbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .clist{max-height:34vh}
}
.clist{overflow-y:auto;border-right:1px solid var(--line);min-height:0;
       background:var(--surface)}
@media(max-width:820px){ .clist{border-right:none;border-bottom:1px solid var(--line)} }
.copt{display:flex;align-items:center;gap:var(--s2);width:100%;text-align:left;
      padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);
      color:var(--ink-dim);transition:background .12s,color .12s}
.copt:hover{background:var(--surface-2);color:var(--ink)}
.copt.on{background:var(--surface-2);color:var(--gold);
         box-shadow:inset 3px 0 0 var(--gold-dim)}
/* Marks the option currently committed to the build, so reopening a chooser
   shows what you are changing away from. */
.copt .cur{margin-left:auto;flex:none;color:var(--gold-dim);font-size:0.8rem}
.copt .tag{margin-left:auto;flex:none;font-size:0.6667rem;letter-spacing:.1em;
           text-transform:uppercase;color:var(--ink-faint)}
.copt.on .tag{color:var(--gold-dim)}
.cfilter{padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);
         position:sticky;top:0;background:var(--surface);z-index:1}
.cfilter input{width:100%;background:var(--ground);color:var(--ink);
  border:1px solid var(--line);border-radius:0;padding:5px var(--s2);
  font-family:inherit;font-size:0.8667rem}
.cfilter input:focus{outline:none;border-color:var(--gold-dim)}

.cdetail{overflow-y:auto;min-height:0;padding:var(--s4) var(--s5)}
.cdetail h4{font-family:var(--f-display);font-weight:500;font-size:1.3333rem;
            letter-spacing:.05em;color:var(--gold);margin:0 0 var(--s2)}
.cdetail .desc{color:var(--ink-dim);margin-bottom:var(--s4);max-width:58ch}
.cdetail .sect{font-size:0.6667rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin:var(--s4) 0 var(--s2);padding-top:var(--s3);
  border-top:1px solid var(--line)}
.cdetail .sub{margin-bottom:var(--s3)}
.cdetail .sub b{display:block;color:var(--ink);font-weight:600;font-size:0.9333rem}
.cdetail .sub span{color:var(--ink-dim);font-size:0.8667rem}
.cdetail .rows{display:flex;flex-direction:column;gap:var(--s1)}
.cdetail .row{display:flex;align-items:baseline;gap:var(--s3);
              font-size:0.8667rem;color:var(--ink-dim)}
.cdetail .row .rk{flex:1;min-width:0}
.cdetail .row .rv{flex:none;color:var(--ink);font-variant-numeric:tabular-nums}
.cdetail .row .rv.up{color:var(--good)}
.cdetail .row .rv.down{color:var(--danger)}
.cdetail .foot{margin-top:var(--s4);padding-top:var(--s3);
  border-top:1px solid var(--line);font-size:0.8rem;color:var(--ink-faint)}
/* Shown before anything is highlighted. The page's generic `.empty` is a
   dashed 48px-padded placeholder box, which reads as a missing panel here --
   the detail pane is briefly empty on every open. Reset it to a plain line. */
.cdetail .empty{color:var(--ink-faint);font-style:italic;
                border:none;padding:0;margin:0;text-align:left}

.cname{padding:var(--s6) var(--s5);display:flex;flex-direction:column;
       gap:var(--s3);align-items:center;justify-content:center;text-align:center}
.cname input{width:min(28rem,100%);background:var(--ground);color:var(--gold);
  border:1px solid var(--line-bright);border-radius:0;
  padding:var(--s3) var(--s4);font-family:var(--f-display);
  font-size:1.6rem;letter-spacing:.04em;text-align:center}
.cname input:focus{outline:none;border-color:var(--gold-dim)}
.cname .sub{color:var(--ink-faint);font-size:0.8667rem}

/* Reset confirmation. Narrower than a chooser -- it is a question, not a
   browser -- and it names what would actually be lost. */
.modal.chooser .sheet.ask{max-width:34rem}
.cask{padding:var(--s5) var(--s5) var(--s4)}
.cask p{margin:0 0 var(--s3);color:var(--ink-dim);line-height:1.5}
.cask p:last-child{margin-bottom:0}
.cask .lose{color:var(--ink);border-left:2px solid var(--danger);
            padding-left:var(--s3);margin-bottom:var(--s4)}
.cask .lose b{color:var(--danger)}
/* The page's generic `.empty` is a dashed, centred, 48px-padded placeholder
   box. Here the text is a sentence in a paragraph, not a placeholder panel,
   so that styling is reset -- same collision as `.cdetail .empty`. */
.cask .lose.empty{border:none;border-left:2px solid var(--line-bright);
                  padding:0 0 0 var(--s3);text-align:left;
                  color:var(--ink-faint);font-style:italic}
.cask .keep{font-size:0.8rem;color:var(--ink-faint)}
.chip.danger.solid{border-color:var(--danger);color:var(--danger)}

.modal.chooser .nav{gap:var(--s3)}
.modal.chooser .nav .right{margin-left:auto;display:flex;gap:var(--s2);
                           align-items:center}
/* The confirm line for a pick that costs a perk point; it replaces the note
   row rather than adding a layer, so the sheet does not jump. */
.cwarn{padding:var(--s2) var(--s4) var(--s3);font-size:0.8rem;
       color:var(--danger);border-top:1px solid var(--line);
       background:rgba(192,91,82,.07)}
.cwarn b{color:var(--danger)}
.chip.go{border-color:var(--gold-dim);color:var(--gold)}
.chip.go:hover:not(:disabled){background:var(--gold-glow)}

.tree{background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tree.dim{opacity:.42}
.tree > header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
               border-bottom:1px solid var(--line);background:var(--surface-2)}
.tree > header .cat{width:3px;height:26px;border-radius:2px;flex:none}
.tree.combat  header .cat{background:var(--combat)}
.tree.magic   header .cat{background:var(--magic)}
.tree.stealth header .cat{background:var(--stealth)}
.tree h3{font-size:1.0667rem;letter-spacing:.05em}
.tree .lv{margin-left:auto;text-align:right;line-height:1.2}
.tree .lv b{display:block;font-family:var(--f-display);font-size:1.2667rem;color:var(--gold)}
.tree .lv b.base{color:var(--ink-faint)}
.tree .lv i{font-style:normal;font-size:0.6667rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}

/* --- constellation view --------------------------------------------- */
.canvas{position:relative;padding:var(--s4)}
.canvas svg{display:block;margin:0 auto;width:100%;height:auto;overflow:visible}

/* The tree only ever renders inside the modal, where it gets the whole sheet: it fills the space the header
   and footer leave and is centred in it. Labels and node radii are in SVG
   units, so scaling enlarges them together and the tree stays legible -- which
   is the point of the bigger window.
   min-height:0 lets this flex item shrink below its content, without which the
   SVG would push the sheet taller than the viewport and clip the top row. */
.modal .canvas{flex:1;min-height:0;display:flex;
               align-items:center;justify-content:center;
               padding:var(--s2) var(--s4)}
/* preserveAspectRatio keeps the tree undistorted, so bounding it on both axes
   makes it fit the box entirely. */
.modal .canvas svg{width:100%;height:100%;max-width:none;max-height:none}
.pnode{cursor:pointer}
.pnode .halo{fill:none;stroke:none}
.pnode .core{transition:fill .18s}
.pnode.maxed .core{fill:var(--ground)}
.pnode:focus-visible{outline:none}
.pnode:focus-visible .halo{stroke:var(--gold);stroke-width:2;fill:none}
.pnode .glow{fill:var(--gold);opacity:0;transition:opacity .2s}
.starglow{opacity:0;pointer-events:none;transition:opacity .2s}
.rankdots{pointer-events:none}
/* An unbought pip used to be --line-bright (#3b414a), which disappears against
   the brighter parts of the nebula. It is now a light grey with a dark halo,
   so it reads on both the dark field and the lit clouds. The halo is a stroke
   rather than a shadow so it scales with the tree. */
.rankdots circle{fill:#c8ccd2;stroke:rgba(6,7,11,.85);stroke-width:1.5}
.rankdots circle.on{fill:var(--gold);stroke:rgba(6,7,11,.9)}

/* ==================================================== the constellation ==
   The tree is where the mod's colour lives, so it is styled apart from the
   grey chrome above.
========================================================================= */
/* The mod's real nebula panorama (intfullnebulapanarama01.dds), kept in
   colour. The first attempt used a white alpha mask at .07 opacity, which
   threw away the teal/mauve/green that defines the backdrop; this carries the
   art's own hues at a strength you can actually see, with a vignette to hold
   the centre dark enough for the stars to read against. */
.modal .canvas{position:relative;background:#05060a}
.modal .canvas::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  /* Two passes of the same panorama at different scales and offsets. The art
     is three discrete clouds, so a single pass leaves half the field empty;
     layering a large soft copy under a smaller one fills the frame the way the
     in-game backdrop does, without needing more texture data. */
  background-image:var(--tree-bg),var(--tree-bg);
  background-size:auto 150%, auto 260%;
  background-position:72% 40%, 8% 62%;
  background-repeat:repeat-x, repeat-x;
  opacity:.5;
  filter:saturate(1.3) blur(1px);
}
/* A dark wash over the middle so bright nodes stay legible on top of cloud. */
.modal .canvas::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 60% at 50% 62%,
             rgba(3,4,8,.72) 0%, rgba(3,4,8,.45) 45%, rgba(3,4,8,.82) 100%);
}
.modal .canvas svg{position:relative;z-index:1}

/* Nodes are stars, not rings: no outline, a filled core, and a coloured glow.
   Three states, distinguished by HUE as much as brightness:
     locked (requirements unmet) -> violet
     available (buyable now)     -> blue-white
     owned                       -> warm gold-white
   Hue is what lets you read the whole tree at a glance without inspecting
   each node. */
.pnode .ring{
  fill:var(--star-avail);stroke:none;
  filter:drop-shadow(0 0 4px var(--star-avail-halo))
         drop-shadow(0 0 9px var(--star-avail-halo));
}
.pnode .core{fill:#fff;opacity:.7}
.pnode.locked .ring{
  fill:var(--star-locked);
  filter:drop-shadow(0 0 4px var(--star-locked-halo))
         drop-shadow(0 0 10px var(--star-locked-halo));
}
.pnode.locked .core{opacity:.45}
.pnode.taken .ring{
  fill:var(--star-owned);
  filter:drop-shadow(0 0 5px var(--star-owned-halo))
         drop-shadow(0 0 14px var(--star-owned-halo));
}
.pnode.taken .core{fill:#fff;opacity:1}
.pnode:hover .ring{stroke:none}
/* The star flare from intperkstars01.dds, tinted gold, on owned nodes only.
   The default-theme circle glow is redundant beside it. */
.pnode .glow{opacity:0}
.pnode.taken .starglow{opacity:.9}
/* Edges are pale cyan star-lines: faint when unowned, lit when both ends are. */
.edge{stroke:#2f4550;stroke-width:1;opacity:.75}
.edge.lit{stroke:var(--edge-line);opacity:.5}
.edge.on{stroke:var(--edge-line);stroke-width:1.4;
  opacity:1;filter:drop-shadow(0 0 2px var(--edge-line))}
/* Labels track the same three states: locked recedes furthest, buyable is
   readable, owned is brightest. */
/* SVG user units, not rem: this text lives inside the viewBox and scales with
   the tree. LABEL_SIZE in the script must match this font-size. */
.plabel{font-size:15px;fill:#6b6478;text-anchor:middle;
        pointer-events:none;transition:fill .18s}
.plabel.avail{fill:#a8b6cc}
.pnode.taken + .plabel,
.plabel.taken{fill:var(--star-owned);font-weight:600}

/* Display type: NORDIC UI's face is spaced small caps, so headings carry
   generous tracking and the skill names are set in caps. */
h1,h2,h3{font-weight:var(--f-weight-display);letter-spacing:.1em}
.masthead h1{letter-spacing:.14em}
.skillcard h3,
.modal .sheet h3{text-transform:uppercase;letter-spacing:.09em}

/* hover card */
.tipwrap{position:relative}
/* Above the modal (z 300) -- the tree it describes now lives inside one. */
.tip{position:fixed;z-index:400;pointer-events:none;opacity:0;
     transition:opacity .12s;
     background:var(--surface-2);border:1px solid var(--line-bright);
     border-radius:3px;padding:var(--s3);width:270px;
     box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-size:0.8667rem;color:var(--ink);margin-bottom:5px}
.tip .ranks{display:flex;flex-direction:column;gap:5px}
.tip .rk{display:grid;grid-template-columns:11px 22px 1fr;gap:6px;
         align-items:baseline;font-size:0.8rem;color:var(--ink-faint);line-height:1.4}
.tip .rk .mark{font-size:0.6rem;color:var(--line-bright)}
.tip .rk .lv{font-size:0.6667rem;text-align:right;font-variant-numeric:tabular-nums}
.tip .rk.owned{color:var(--ink-dim)}
.tip .rk.owned .mark{color:var(--gold)}
.tip .rk.next{color:var(--ink)}
.tip .rk.next .mark{color:var(--gold-dim)}
.tip .d{font-size:0.8rem;color:var(--ink-dim);line-height:1.45}
.tip .r{font-size:0.7333rem;color:var(--ink-faint);margin-top:5px;letter-spacing:.04em}
.tip .r .miss{color:var(--danger)}

.perks{list-style:none;margin:0;padding:var(--s2) 0}
.perk{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;
      padding:var(--s2) var(--s4);position:relative;cursor:pointer;
      transition:background .12s}
.perk:hover:not(.locked){background:var(--surface-2)}
.perk.locked{cursor:not-allowed}
.perk.locked .nm,.perk.locked .rq{color:var(--locked)}

/* connector spine */
.perk .node{position:relative;width:12px;display:flex;justify-content:center;padding-top:5px}
.perk .node::before{content:"";position:absolute;top:0;bottom:-100%;width:1px;background:var(--line);left:50%}
.perk:last-child .node::before{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-bright);
     background:var(--ground);position:relative;z-index:1;transition:all .18s}
.perk.avail .dot{border-color:var(--gold-dim)}
.perk.taken .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.perk.locked .dot{border-color:var(--locked)}

.perk .body{min-width:0}
.perk .nm{font-size:0.9333rem;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.perk.taken .nm{color:var(--gold)}
.perk .desc{font-size:0.8333rem;color:var(--ink-dim);line-height:1.45;margin-top:2px}
.perk .rq{font-size:0.7333rem;color:var(--ink-faint);letter-spacing:.05em;margin-top:3px}
.perk .rq .miss{color:var(--danger)}

/* rank pips */
.pips{display:flex;gap:3px;align-items:center;padding-top:5px}
.pip{width:7px;height:7px;border:1.5px solid var(--line-bright);border-radius:1px;transition:all .18s}
.pip.on{background:var(--gold);border-color:var(--gold)}
.perk.locked .pip{border-color:var(--locked)}

.src{font-size:0.6333rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
     border:1px solid var(--line);border-radius:2px;padding:0 4px}

.empty{padding:var(--s7) var(--s4);text-align:center;color:var(--ink-faint);
       border:1px dashed var(--line);border-radius:3px}


@media(prefers-reduced-motion:reduce){*{transition:none !important}}

     sheet is sized to the viewport and holds an SVG whose layout must not be

     it on every open. Two elements keep both bodies independent. -->

<script>
"use strict";

/* ============================================================ data ======
   The four generated globals, plus a FormID lookup for every perk. */
const P = window.PERK_DATA, L = window.LEVELING_DATA, C = window.CHARACTER_DATA;
const R = window.RELIGION_DATA || {deities: []};

// Perk lookup by formId, and which skill each belongs to.
const PERK = new Map();
P.skills.forEach(s => s.perks.forEach(p => PERK.set(p.formId, {p, skill: s})));

// leveling.perLevel is 1-indexed by level.
const perLevel = L.perLevel;
const maxLevel = L.totals.maxLevel;

/* =========================================================== state ======
   S is the build (serialized to the URL). CH and ASK are UI-only. */
const S = {
  level: 1,
  name: "",
  // Race and class start UNSET, like the stone and the devotion. There is no
  // sensible default race, and silently starting every build as the first
  // entry in the list hides a decision that changes the whole character.
  race: "",
  cls:  "",
  trait: "",
  stone: "",
  deity: "",
  // Survival Mode. Only its carry-weight penalty is modelled -- hunger, cold
  // and fast travel are gameplay state, not build choices.
  survival: false,
  ranks: new Map(),          // formId -> ranks bought (>=1)
  // One entry per level-up taken, in order: "h" | "m" | "s". The Nth entry is
  // the choice made on reaching level N+1, and the gain depends on THAT level
  // (this modlist grants 20 at level 2 and 10 thereafter), so order matters.
  picks: [],
  skill: "",                 // last-viewed tree (skill editorId); "" = none
  open: "",                  // skill whose tree modal is open; "" = closed
};

/* The chooser's own state, kept out of S because none of it is part of the
   build -- it is never serialized to the hash. `pick` is the option under the
   cursor in the list, which drives the detail pane and the live preview; it is
   NOT committed until Choose/Next is pressed, so arrowing through the list
   previews consequences without changing the build. */
const CH = {
  field: "",       // "" = closed; otherwise name|race|cls|trait|stone|deity
  pick: "",        // highlighted option's id (or the typed name)
  filter: "",
  confirm: false,  // a cost was shown and needs a second press
  lastFocus: null,
};

// Reset destroys a whole build with no undo, so it asks first. It reuses the
// chooser's modal element rather than adding a third dialog pattern; `ask` is
// the discriminator that decides which body renderChooser() draws.
const ASK = {
  open: false,
  lastFocus: null,
};

// The six character choices, in display order. Everything that iterates or
// clears them uses this rather than repeating the list.
const CHOICE_FIELDS = ["name", "race", "cls", "trait", "stone", "deity"];

// Clear every choice back to unset. Used by Reset and by a hash change, which
// must not let a link that omits a field inherit the previous build's value.
function clearChoices(){
  CHOICE_FIELDS.forEach(f => { S[f] = ""; });
  S.survival = false;
}

// The level slider and its readout always move together.
function setLevelControl(level){
  document.getElementById("lvl").value = level;
  document.getElementById("lvlOut").textContent = level;
}

// The page behind a dialog must not scroll. Derived from state rather than set
// by each open/close site: the tree modal and the chooser can be up at the same
// time, so an unconditional unlock on either one's close freed the page while
// the other was still showing.
function syncScrollLock(){
  document.body.style.overflow = (S.open || CH.field || ASK.open) ? "hidden" : "";
}

/* ========================================================= derived ======
   Everything computed from S: budget, skill levels, prerequisites. */

// Perk points granted by the character's level, plus script-granted bonuses.
// Two exist, both calling Game.AddPerkPoints(1) at game start, so both are
// available even at level 1: the Imperial race and the Faithless trait.
function bonusPerkPoints(st_ = S){
  const r = C.races.find(x => x.editorId === st_.race);
  const t = (C.traits || []).find(x => x.trait === st_.trait);
  return ((r && r.bonusPerkPoints) || 0) + ((t && t.bonusPerkPoints) || 0);
}
function pointsAvailable(st_ = S){
  const row = perLevel[Math.min(st_.level, maxLevel) - 1];
  return (row ? row.cumulativePerkPoints : 0) + bonusPerkPoints(st_);
}
function pointsSpent(){
  let n = 0;
  for (const r of S.ranks.values()) n += r;
  return n;
}

// Skill levels are DERIVED: a skill is raised to the highest rank requirement
// among the perks actually bought in it. Base floor is the modlist's starting
// skill level (5 in this list, from the Apprentice addon).
const BASE_SKILL = (C.startingSkillLevel && C.startingSkillLevel.value) || 5;

// A class sets one major skill to 20 and four minors to 15 at creation, which
// raises the floor those skills start from.
function classSkillFloor(skillName){
  const c = C.classes.find(x => x.class === S.cls);
  if (!c || !c.skills) return BASE_SKILL;
  const hit = c.skills.find(s => s.skill === skillName);
  return hit ? Math.max(BASE_SKILL, hit.level) : BASE_SKILL;
}

function skillLevel(skill){
  let lv = classSkillFloor(skill.name);
  for (const p of skill.perks){
    const r = S.ranks.get(p.formId);
    if (!r) continue;
    // rankSkillLevels[i] is the gate for rank i+1
    const need = p.rankSkillLevels[Math.min(r, p.rankSkillLevels.length) - 1];
    if (need > lv) lv = need;
  }
  return lv;
}

// Prereqs are satisfied per the perk's own condition logic. Adamant's
// convergence perks (Mythic Smithing, Twin Secrets, Warmaster, Berserker,
// Chemist, Resolve, Fists of Fury) OR their prerequisites together -- you need
// EITHER branch, not both -- which the CTDA OR flag records.
function prereqsMet(p){
  if (!p.prerequisites.length) return true;
  const owned = q => (S.ranks.get(q.formId) || 0) > 0;
  return p.prerequisiteLogic === "any"
    ? p.prerequisites.some(owned)
    : p.prerequisites.every(owned);
}

// A perk's prerequisites as text, joined by the logic it actually uses.
const prereqNames = p =>
  p.prerequisites.map(q => q.name)
                 .join(p.prerequisiteLogic === "any" ? " or " : " + ");

// Can we buy the NEXT rank of this perk right now?
// Skill level is auto-derived, so it never blocks -- only prereqs and budget do.
function canBuy(p){
  const have = S.ranks.get(p.formId) || 0;
  if (have >= p.ranks) return false;
  if (!prereqsMet(p)) return false;
  return pointsSpent() < pointsAvailable();      // hard budget
}

// Removing a rank must not orphan perks that depend on this one. Under "any"
// logic a dependent survives as long as one of its other prerequisites is
// still owned, so test the real condition rather than mere membership.
function dependents(formId){
  const out = [];
  for (const [fid, r] of S.ranks){
    if (!r) continue;
    const e = PERK.get(fid);
    if (!e) continue;
    const p = e.p;
    if (!p.prerequisites.some(q => q.formId === formId)) continue;
    const stillOwned = q => q.formId !== formId && (S.ranks.get(q.formId) || 0) > 0;
    const ok = p.prerequisiteLogic === "any"
      ? p.prerequisites.some(stillOwned)
      : p.prerequisites.every(stillOwned);
    if (!ok) out.push(fid);
  }
  return out;
}

/* ============================================================ effects ===
   The mods describe their own effects in player-facing text, and those
   strings carry the magnitudes (Pilgrim/Apprentice ship <mag>-style
   placeholders that we already resolved at extract time). Rather than
   hand-transcribing ~100 numbers, parse the descriptions into modifiers.
   Anything that doesn't match a pattern still displays as text -- it just
   doesn't feed the math.
======================================================================== */
const FX_RULES = [
  // flat attribute pools
  [/(?:Your|You have) Health, Magicka, and Stamina (?:are|is) increased by (\d+)/i, m => [["health",+m[1]],["magicka",+m[1]],["stamina",+m[1]]]],
  [/You have (\d+) extra Health, Magicka, and Stamina/i,                            m => [["health",+m[1]],["magicka",+m[1]],["stamina",+m[1]]]],
  [/Your Health is increased by (\d+)/i,                                            m => [["health",+m[1]]]],
  [/Your Magicka is increased by (\d+)/i,                                           m => [["magicka",+m[1]]]],
  [/Your Stamina is increased by (\d+)/i,                                           m => [["stamina",+m[1]]]],
  // secondary stats
  [/Your Carry Weight is increased by (\d+)/i,                                      m => [["carry",+m[1]]]],
  [/Your Armor Rating is increased by (\d+)/i,                                      m => [["armor",+m[1]]]],
  // resistances (percent)
  [/Your Magic Resistance is increased by (\d+)%/i,                                 m => [["magicRes",+m[1]]]],
  [/Your Fire Resistance is increased by (\d+)%/i,                                  m => [["fireRes",+m[1]]]],
  [/Your Frost Resistance is increased by (\d+)%/i,                                 m => [["frostRes",+m[1]]]],
  [/Your Shock Resistance is increased by (\d+)%/i,                                 m => [["shockRes",+m[1]]]],
  [/Your Poison Resistance is increased by (\d+)%/i,                                m => [["poisonRes",+m[1]]]],
  [/Your Disease Resistance is increased by (\d+)%/i,                               m => [["diseaseRes",+m[1]]]],
  [/Your Injury Resistance (?:and Disease Resistance )?(?:are|is) increased by (\d+)%/i, m => [["injuryRes",+m[1]]]],
  [/Your Fire Resistance, Frost Resistance, and Shock Resistance are increased by (\d+)%/i,
     m => [["fireRes",+m[1]],["frostRes",+m[1]],["shockRes",+m[1]]]],
  // movement / misc
  [/You(?:r Movement Speed is increased by| move) (\d+)% (?:faster|more)/i,          m => [["speed",+m[1]]]],
  [/Your Movement Speed is increased by (\d+)%/i,                                   m => [["speed",+m[1]]]],
  [/You have (\d+)% Spell Absorption/i,                                             m => [["spellAbsorb",+m[1]]]],

  /* ---- penalties -------------------------------------------------------
     Every rule above matches "increased by", so before these existed the
     builder silently dropped every drawback in the modlist: Trollkin's fire
     weakness, the Apprentice Stone's elemental weakness, and the Daedric
     devotions' costs. A double-edged effect showed only its upside, which is
     exactly backwards for deciding whether to take it.
     Magnitudes are negative so they simply sum with the bonuses.
  --------------------------------------------------------------------- */
  [/Your Health is reduced by (\d+)/i,                                              m => [["health",-m[1]]]],
  [/Your Magicka is reduced by (\d+)/i,                                             m => [["magicka",-m[1]]]],
  [/Your Stamina is reduced by (\d+)/i,                                             m => [["stamina",-m[1]]]],
  [/Your Magicka and Stamina are reduced by (\d+)/i,                                m => [["magicka",-m[1]],["stamina",-m[1]]]],
  [/Your Carry Weight is reduced by (\d+)/i,                                        m => [["carry",-m[1]]]],
  [/Your Armor Rating is reduced by (\d+)/i,                                        m => [["armor",-m[1]]]],
  [/Your Magic Resistance is reduced by (\d+)%/i,                                   m => [["magicRes",-m[1]]]],
  [/Your Fire Resistance is reduced by (\d+)%/i,                                    m => [["fireRes",-m[1]]]],
  [/Your Frost Resistance is reduced by (\d+)%/i,                                   m => [["frostRes",-m[1]]]],
  [/Your Shock Resistance is reduced by (\d+)%/i,                                   m => [["shockRes",-m[1]]]],
  [/Your Poison Resistance is reduced by (\d+)%/i,                                  m => [["poisonRes",-m[1]]]],
  [/Your Disease Resistance is reduced by (\d+)%/i,                                 m => [["diseaseRes",-m[1]]]],
  [/Your Poison and Disease Resistance are reduced by (\d+)%/i,                     m => [["poisonRes",-m[1]],["diseaseRes",-m[1]]]],
  [/Your (?:own )?Fire,? Frost,? and Shock Resistances? are reduced by (\d+)%/i,
     m => [["fireRes",-m[1]],["frostRes",-m[1]],["shockRes",-m[1]]]],
  [/Your Movement Speed is reduced by (\d+)%/i,                                     m => [["speed",-m[1]]]],
];

/* Clauses that describe a SITUATIONAL effect. The engine deliberately reports
   these as text without folding them into the totals -- "while blocking" or
   "when you do not control a zombie" is not a flat modifier, and counting it
   would overstate the build. Applied to each clause, not the whole string, so
   a description that pairs an unconditional bonus with a conditional penalty
   still contributes the half that always applies. */
const FX_CONDITIONAL = /\b(?:while|whenever|when(?:ever)? you|if you|unless|during|as long as|below|under half|near|nearby enemies)\b/i;

const STAT_META = {
  health:{label:"Health",unit:""},   magicka:{label:"Magicka",unit:""},
  stamina:{label:"Stamina",unit:""}, carry:{label:"Carry Weight",unit:""},
  armor:{label:"Armor Rating",unit:""}, speed:{label:"Movement Speed",unit:"%"},
  magicRes:{label:"Magic Resist",unit:"%"}, fireRes:{label:"Fire Resist",unit:"%"},
  frostRes:{label:"Frost Resist",unit:"%"}, shockRes:{label:"Shock Resist",unit:"%"},
  poisonRes:{label:"Poison Resist",unit:"%"}, diseaseRes:{label:"Disease Resist",unit:"%"},
  injuryRes:{label:"Injury Resist",unit:"%"}, spellAbsorb:{label:"Spell Absorption",unit:"%"},
};
// Order the derived panel reads in.
const STAT_ORDER = ["carry","armor","magicRes","fireRes","frostRes","shockRes",
                    "poisonRes","diseaseRes","injuryRes","spellAbsorb","speed"];

// Parse one description into [[stat, amount], ...].
/* Parse a description into flat modifiers.

   This used to return on the FIRST matching rule, which silently dropped the
   second half of every compound effect -- "Carry Weight +100. You move 20%
   faster" contributed only the carry weight, and Trollkin ("Health Regen up,
   but Fire Resistance down") contributed nothing at all because no rule
   matched a reduction.

   Now the text is split into clauses and every clause is matched
   independently, so a sentence can yield several modifiers. Clauses that read
   as situational are reported as text but kept out of the totals.

   Rule order still matters within a clause: the combined patterns ("Fire,
   Frost, and Shock") are listed before the single-stat ones so the broader
   match wins, and only the first rule to match a given clause is applied. */
function fxParse(text){
  const t = strip(text || "");
  if (!t) return [];
  // Split on sentence and clause boundaries. ", but" separates the halves of a
  // double-edged effect; full stops separate sentences.
  //
  // ", and" is NOT a safe split point on its own: the modlist writes stat
  // lists with an Oxford comma ("Fire, Frost, and Shock Resistance are reduced
  // by 25%"), and splitting there destroys the very phrase the combined rules
  // match. So an ", and" only splits when what follows starts a new statement
  // -- "you"/"your"/"sprinting" etc. -- rather than continuing a list.
  const clauses = t
    .split(/(?:\.\s+|,\s*but\s+|,\s*and\s+(?=you\b|your\b|sprinting\b|spells\b)|;\s*|\s+but\s+(?=your?\b))/i)
    .map(s => s.trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  for (const c of clauses){
    if (FX_CONDITIONAL.test(c)) continue;          // situational: text only
    // A clause can still carry two unrelated stats ("Your Stamina is
    // increased by 50, you move 10% faster"), so every rule is tried. Rules
    // are skipped when their match OVERLAPS text an earlier rule already
    // consumed -- that is what stops the single-stat patterns from
    // re-matching a combined "Fire, Frost, and Shock" phrase.
    const taken = [];
    for (const [re, fn] of FX_RULES){
      const m = c.match(re);
      if (!m) continue;
      const from = m.index, to = m.index + m[0].length;
      if (taken.some(([a, z]) => from < z && to > a)) continue;
      taken.push([from, to]);
      for (const mod of fn(m)){
        const key = `${mod[0]}:${mod[1]}:${from}`;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(mod);
      }
    }
  }
  return out;
}

/* Resolve which devotion text is actually in effect for a deity.
   Two deities (Tall Papa, and one other) ship a `variants[]` array keyed by
   standing stone; the rest have a single `devotion`. The variant key is a bare
   stone word ("Apprentice") while stones are records whose display name is
   "The Apprentice Stone", so the join strips the article and the trailing
   "Stone". Joining on a display name is exactly the pattern that silently
   broke class skills before (see PROJECT.md), so this fails LOUDLY-ish: an
   unmatched variant returns the base devotion rather than nothing, and
   deityVariantUnresolved() reports the gap to the UI. */
function stoneWord(stone){
  if (!stone) return "";
  return String(stone.name || "").replace(/^The\s+/i, "").replace(/\s+Stone$/i, "").trim();
}
function deityDevotion(dt, stoneEditorId){
  if (!dt) return null;
  const vs = dt.variants || [];
  if (!vs.length) return dt.devotion || null;
  const stone = C.standingStones.find(x => x.editorId === stoneEditorId);
  if (!stone) return dt.devotion || null;
  const w = stoneWord(stone).toLowerCase();
  const hit = vs.find(v => String(v.variant || "").trim().toLowerCase() === w);
  return hit || dt.devotion || null;
}
// Only some `variants[]` are stone-keyed. Tall Papa's 13 map 1:1 onto the 13
// stones; "The Beast Stone" also has a variants array but its single key is
// "Summon", which is not a stone at all. Treat a deity as stone-varying only
// when its variant words actually intersect the stone list, so the UI does not
// promise a stone choice that would change nothing.
const STONE_WORDS = new Set(C.standingStones.map(s => stoneWord(s).toLowerCase()));
function isStoneVaried(dt){
  return (dt && dt.variants || []).some(
    v => STONE_WORDS.has(String(v.variant || "").trim().toLowerCase()));
}
// True when this deity varies by stone but we could not resolve which variant
// applies -- either no stone is chosen, or the names failed to join.
function deityVariantUnresolved(dt, stoneEditorId){
  if (!isStoneVaried(dt)) return false;
  const stone = C.standingStones.find(x => x.editorId === stoneEditorId);
  if (!stone) return true;
  const w = stoneWord(stone).toLowerCase();
  return !dt.variants.some(v => String(v.variant || "").trim().toLowerCase() === w);
}

// Everything currently applied to the character, as {source, label, text, mods}.
// Takes the state to read so the chooser can evaluate a hypothetical pick
// without mutating the build; defaults to the live state.
function activeEffects(st_ = S){
  const out = [];
  const add = (source, label, text) => {
    if (!text) return;
    out.push({source, label, text: strip(text), mods: fxParse(text)});
  };

  const race = C.races.find(x => x.editorId === st_.race);
  if (race) race.powers.forEach(p => add("Race", p.name, p.description));

  const cls = C.classes.find(x => x.class === st_.cls);
  if (cls) cls.effects.forEach(e => add("Class", e.name, e.description));

  const tr = (C.traits || []).find(x => x.trait === st_.trait);
  if (tr) add("Trait", tr.name, tr.description);

  const st = C.standingStones.find(x => x.editorId === st_.stone);
  if (st) add("Stone", st.name, st.description);

  const dt = R.deities.find(x => x.deity === st_.deity);
  // A deity whose devotion varies by standing stone resolves against the stone
  // actually chosen. Previously the UI only counted the variants and always
  // showed the base text, so Tall Papa's devotion was never the one in effect.
  const dv = dt ? deityDevotion(dt, st_.stone) : null;
  // A devotion only applies with RANK 2 of the Pilgrim perk. Without it the
  // deity is still a chosen allegiance, but it grants nothing -- so the effect
  // is listed as inactive rather than folded into the totals.
  if (dv){
    if (pilgrimRank(st_) >= 2) add("Devotion", dv.name, dv.description);
    else out.push({source: "Devotion", label: dv.name, text: strip(dv.description),
                   mods: [], inactive: "needs Pilgrim rank 2"});
  }
  // The shrine blessing used to live only in the deity hint. It is temporary
  // (8h) rather than permanent, so it is listed but kept out of the maths --
  // fxParse would otherwise fold it into the derived totals.
  if (dt && dt.blessing){
    out.push({source: "Devotion", label: `Shrine: ${dt.blessing.name}`,
              text: strip(dt.blessing.description), mods: []});
  }

  // Bought perks contribute to the DERIVED STATS but are deliberately not
  // listed in Active Effects: the perks a build owns are already shown by the
  // skill cards and the Invested panel, and 70 points' worth of them buried
  // the five character choices this card exists to show.
  //
  // `hidden` keeps them out of renderEffects() and both exports while still
  // feeding fxTotals(). Without this, Strong Back and Deep Pockets never moved
  // carry weight -- no perk touched any derived stat.
  //
  // The text used is the description of the rank actually OWNED: rank 2
  // usually restates the total rather than adding to rank 1 ("increased by
  // 50" then "increased by 100"), so summing the ranks would double-count.
  for (const [fid, rank] of st_.ranks){
    const e = PERK.get(fid);
    if (!e) continue;
    const {p, skill} = e;
    const descs = p.rankDescriptions && p.rankDescriptions.length
      ? p.rankDescriptions : [p.description];
    const text = descs[Math.min(rank, descs.length) - 1] || p.description;
    if (!text) continue;
    out.push({
      source: "Perk",
      hidden: true,
      label: p.ranks > 1 ? `${p.name} (${rank}/${p.ranks})` : p.name,
      skill: skill.name,
      text: strip(text),
      mods: fxParse(text),
    });
  }

  return out;
}

/* ----------------------------------------------------------- pilgrim ----
   Pilgrim (Adamant, Restoration) is a 2-rank perk gated at Restoration 30/60.
   A devotion only takes effect at RANK 2 -- rank 1 only strengthens the
   temporary shrine blessings. Without rank 2 a chosen deity is an allegiance
   that grants nothing, so activeEffects() lists it as inactive and keeps it
   out of the derived totals.

   Resolved by FormID, not by name: display names are not stable across mod
   updates, and joining on one is the bug PROJECT.md documents for class
   skills. The editor ID is used only to FIND the FormID once, at load.
======================================================================== */
const PILGRIM_FID = (() => {
  for (const s of P.skills)
    for (const p of s.perks)
      if (p.editorId === "MAG_Pilgrim30") return p.formId;
  return null;
})();
const pilgrimRank = (st_ = S) =>
  PILGRIM_FID ? (st_.ranks.get(PILGRIM_FID) || 0) : 0;

/* ---------------------------------------------------------- survival ----
   Survival Mode subtracts a flat amount from carry weight while enabled. The
   magnitude is extracted from the winning override of the ability spell
   (Starfrost's MAG_StarfrostCarryWeightSpell, 100 here -- vanilla ships 150
   and Survival Mode Improved lowers it), so a mod retune is picked up without
   touching this file. Carry weight is the ONLY thing modelled: Survival's
   hunger, cold and fast-travel rules are gameplay state, not build choices.
======================================================================== */
const SURVIVAL = (C.survival && C.survival.available) ? C.survival : null;
const survivalCarryPenalty = (st_ = S) =>
  (st_.survival && SURVIVAL && SURVIVAL.carryWeightPenalty) || 0;

/* --------------------------------------------------- hypothetical state -
   A shallow clone of the build with one field swapped, for previewing a pick
   before it is committed. Only the fields the effects/budget maths read are
   needed; `ranks` is shared by reference because nothing here mutates it. */
function withField(field, value){
  const h = {
    level: S.level, race: S.race, cls: S.cls, trait: S.trait,
    stone: S.stone, deity: S.deity, ranks: S.ranks, picks: S.picks,
    survival: S.survival,
  };
  if (field in h) h[field] = value;
  return h;
}

// Sum the parsed modifiers by stat.
function fxTotals(effects){
  const t = {};
  effects.forEach(e => e.mods.forEach(([k,v]) => { t[k] = (t[k]||0) + v; }));
  return t;
}

function attrTotal(st_ = S){
  // Every race starts from the same base (the Player NPC_ record); racial
  // differences arrive as powers, which the effects engine folds in below.
  const a = C.baseAttributes || {health:100, magicka:100, stamina:100};
  const base = {h: a.health || 0, m: a.magicka || 0, s: a.stamina || 0};
  const lvlup = {h: 0, m: 0, s: 0};
  st_.picks.forEach((k, i) => {
    // Pick i is made on reaching level i+2, and uses that level's gain.
    const lv = Math.min(i + 2, maxLevel);
    const row = perLevel[lv - 1];
    lvlup[k] += row ? (k === "h" ? row.healthPerChoice
                     : k === "m" ? row.magickaPerChoice
                     : row.staminaPerChoice) : 10;
  });
  // Flat pool bonuses from stone / trait / devotion / racial power.
  const fx = fxTotals(activeEffects(st_));
  const bonus = {h: fx.health || 0, m: fx.magicka || 0, s: fx.stamina || 0};
  return {
    h: base.h + lvlup.h + bonus.h,
    m: base.m + lvlup.m + bonus.m,
    s: base.s + lvlup.s + bonus.s,
    base, lvlup, bonus,
  };
}
const attrSpent = () => S.picks.length;
const attrCount = k => S.picks.filter(x => x === k).length;
const attrAvail = () => Math.max(0, Math.min(S.level, maxLevel) - 1);

/* ======================================================== overspend =====
   Lowering the level, or dropping a race or trait that granted a bonus perk
   point, can leave a build spending more than it now has. Nothing is refunded
   automatically: silently deleting perks the user chose is worse than showing
   an invalid build, and the fix (raise the level again, or pick the bonus back
   up) is one action away. The over-budget state is surfaced instead, and it is
   the user's to resolve. */

// How far past the budget the build is spending. 0 when legal.
const perkOverspend = () => Math.max(0, pointsSpent() - pointsAvailable());

// How many level-up choices are taken beyond what the level allows. 0 when
// legal. Like perkOverspend, this is reported rather than corrected.
const attrOverspend = () => Math.max(0, attrSpent() - attrAvail());

/* ========================================================= actions ======
   Mutations of S: buy, sell, clear a tree. */

// Buying/selling inside the modal must not rebuild the SVG under the cursor --
// that would drop hover and re-run layout on every click. Update the side
// panels, then repaint just the node states in place.
function afterSpend(){
  const effects = activeEffects();
  renderBudget();
  renderAttrs();
  renderDerived(effects);
  renderEffects(effects);
  renderInvested();
  if (S.open) repaintTree(); else renderGroups();
  saveHash();
}

// Refund every rank bought in one skill. Safe to drop wholesale: no perk in
// this data depends on a perk in another tree (verified against perks.json --
// 0 cross-tree prerequisites), so clearing a tree cannot orphan anything
// outside it, and everything inside it is going away together.
function clearTree(skill){
  let freed = 0;
  skill.perks.forEach(p => {
    const r = S.ranks.get(p.formId) || 0;
    if (r){ freed += r; S.ranks.delete(p.formId); }
  });
  return freed;
}

function buy(p){
  if (!canBuy(p)) return;
  S.ranks.set(p.formId, (S.ranks.get(p.formId) || 0) + 1);
  afterSpend();
}
function sell(p){
  const have = S.ranks.get(p.formId) || 0;
  if (!have) return;
  if (have === 1){
    const deps = dependents(p.formId);
    if (deps.length){
      const names = deps.map(d => PERK.get(d).p.name).join(", ");
      flash(`Refund ${names} first. ${p.name} unlocks it.`);
      return;
    }
    S.ranks.delete(p.formId);
  } else {
    S.ranks.set(p.formId, have - 1);
  }
  afterSpend();
}

let flashTimer = null;
// Message goes wherever the user is looking: the modal's own note line while a
// tree is open, otherwise the budget card.
function flash(msg){
  const inModal = S.open && document.getElementById("modalNote");
  const el = inModal || document.getElementById("ptsNote");
  el.textContent = msg;
  el.classList.add("warn");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    el.classList.remove("warn");
    el.innerHTML = "&nbsp;";
    renderBudget();
  }, 2600);
}

/* ========================================================== render ======
   S to DOM. Each function owns one region and is safe to call alone. */
function renderBudget(){
  const avail = pointsAvailable(), spent = pointsSpent();
  const left = avail - spent;
  const big = document.getElementById("ptsLeft");
  big.textContent = left;
  big.classList.toggle("over", left < 0);
  document.getElementById("ptsOf").textContent = `of ${avail} remaining`;
  const bar = document.getElementById("ptsBar");
  bar.style.width = (avail ? Math.min(100, spent / avail * 100) : 0) + "%";
  bar.classList.toggle("over", left < 0);

  // "of N remaining" already carries the spend; the note only earns its place
  // when there is a bonus point to explain or the budget is blown. Overspend
  // is never corrected automatically, so the note has to say what to do.
  const note = document.getElementById("ptsNote");
  const over = perkOverspend();
  note.classList.toggle("warn", over > 0);
  const bonus = bonusPerkPoints();
  note.textContent = over
    ? `${over} over budget at level ${S.level}: refund ${
        over === 1 ? "a perk" : "some perks"} or raise the level`
    : bonus ? `+${bonus} bonus`
    : "";
}

function renderAttrs(){
  const t = attrTotal(), avail = attrAvail(), spent = attrSpent();
  const max = Math.max(t.h, t.m, t.s, 1);
  // The first pick is worth double: it is made on reaching level 2, which is
  // the only level in this modlist that grants 20 per choice (10 thereafter).
  // Which attribute got it is a real build fact and was previously invisible,
  // since the counters only showed how many picks each had.
  const firstPick = S.picks[0] || "";
  const firstGain = (perLevel[1] || {}).healthPerChoice || 20;
  const laterGain = (perLevel[2] || {}).healthPerChoice || 10;

  for (const [k, id] of [["h","h"],["m","m"],["s","s"]]){
    const el = document.getElementById(id + "Val");
    el.textContent = t[k];
    el.title = `${t.base[k]} base + ${t.lvlup[k]} level-ups`
             + (t.bonus[k] ? ` + ${t.bonus[k]} bonus` : "")
             + (k === firstPick ? `\nFirst choice: +${firstGain} instead of +${laterGain}` : "");
    document.getElementById(id + "Bar").style.width = (t[k] / max * 100) + "%";
    document.getElementById(id + "Cnt").textContent = attrCount(k);
  }
  // NOT disabled when the level-ups are all spent: a disabled button swallows
  // contextmenu too, so there would be no way to take a choice back. The click
  // handler already refuses to overspend, and `full` just styles it as
  // unavailable for buying while leaving right-click working.
  document.querySelectorAll(".pick button").forEach(b => {
    b.classList.toggle("full", spent >= avail);
    b.title = spent >= avail
      ? "No level-up choices left. Right-click to take one back"
      : "Click to spend a level-up · right-click to take one back";
  });
  // Taking more choices than the level allows is reported, never corrected:
  // lowering the level used to silently pop the newest picks. The line turns
  // red and names the shortfall so the build reads as invalid until fixed.
  const over = attrOverspend();
  const LV = {h: "Health", m: "Magicka", s: "Stamina"};
  const lvlups = document.getElementById("lvlups");
  lvlups.textContent = over
    ? `${spent} level-up choices used but only ${avail} available at level `
      + `${S.level}: ${over} too many`
    : `${spent} of ${avail} level-up choices used`
      + (firstPick ? ` · first went to ${LV[firstPick]} (+${firstGain})` : "");
  lvlups.classList.toggle("over", over > 0);

  const ar = document.getElementById("attrReset");
  if (ar) ar.disabled = !S.picks.length;
}

// Signed display for a modifier: "+50" / "-50".
const fxSign = n => (n < 0 ? "-" : "+") + Math.abs(n);

function renderDerived(effects){
  const box = document.getElementById("derived");
  const t = fxTotals(effects);
  // Carry weight has a real base (RACE DATA), so show the total, not just the bonus.
  const race = C.races.find(x => x.editorId === S.race);
  const carryBase = (race && race.carryWeight) || 0;
  const pen = survivalCarryPenalty(S);
  const rows = STAT_ORDER
    .filter(k => t[k] || (k === "carry" && (carryBase || pen)))
    .map(k => {
      const m = STAT_META[k];
      if (k === "carry" && (carryBase || pen)){
        const tot = carryBase + (t[k] || 0) - pen;
        const parts = [];
        if (t[k]) parts.push(`<span class="${t[k] < 0 ? "pen" : "bonus"}">${
          fxSign(t[k])}</span>`);
        if (pen) parts.push(`<span class="pen">-${pen} survival</span>`);
        return `<div class="k">${esc(m.label)}</div>`
             + `<div class="v num">${tot}`
             + (parts.length ? ` <span class="sub">(${parts.join(" ")})</span>` : "")
             + `</div>`;
      }
      // Penalties are real: a negative total must read as a loss, not as
      // "+-50". Fire Resistance -50% is exactly what Trollkin costs.
      return `<div class="k">${esc(m.label)}</div>`
           + `<div class="v num ${t[k] < 0 ? "pen" : "bonus"}">${
               fxSign(t[k])}${m.unit}</div>`;
    });
  // Left empty when there is nothing to report; CSS collapses it, so the
  // attributes card simply ends rather than carrying a placeholder line.
  box.innerHTML = rows.join("");
}

function renderEffects(effects){
  const box = document.getElementById("fx");
  // Perks are marked `hidden`: they feed the derived totals but are not listed
  // here, since the skill cards and the Invested panel already show them.
  const order = ["Race","Class","Trait","Stone","Devotion"];
  const groups = order
    .map(src => [src, effects.filter(e => e.source === src && !e.hidden)])
    .filter(([, list]) => list.length);

  // Tested on `groups`, not on `effects`: a build with perks bought but no
  // character choices has effects to sum yet nothing to list here, and testing
  // the raw array left the card blank instead of explaining itself.
  if (!groups.length){
    box.innerHTML = `<div class="none">No race, class, trait, stone, or devotion selected.</div>`;
    return;
  }

  box.innerHTML = groups.map(([src, list]) =>
    `<div class="grp"><b>${esc(src)}</b>` +
    list.map(e =>
      `<span${e.inactive ? ' class="inactive"' : ""}><em>${esc(e.label)}</em>` +
      (e.inactive ? ` <b class="warn">${esc(e.inactive)}</b>` : "") +
      `: ${esc(e.text)}</span>`).join("") +
    `</div>`
  ).join("");
}

function renderInvested(){
  const box = document.getElementById("inv");
  const rows = P.skills
    .map(s => {
      let pts = 0;
      s.perks.forEach(p => { pts += S.ranks.get(p.formId) || 0; });
      return {name: s.name, pts, lv: skillLevel(s)};
    })
    .filter(r => r.pts > 0)
    .sort((a,b) => b.pts - a.pts);

  if (!rows.length){
    box.innerHTML = `<div class="none">No perks selected yet.</div>`;
    return;
  }
  box.innerHTML = rows.map(r =>
    `<div class="row"><b>${esc(r.name)} <span style="color:var(--ink-faint)">· ${r.lv}</span></b><span class="num">${r.pts}</span></div>`
  ).join("");
}

function visibleSkills(){ return P.skills; }

const CATEGORIES = ["Combat", "Magic", "Stealth"];

const skillById = id => P.skills.find(s => s.editorId === id) || null;

// Attribute selectors are built from editor IDs, which are plain identifiers
// here, but quote defensively rather than trusting the data. Declared as a
// function so it hoists above its callers.
function cssEsc(s){
  return (window.CSS && CSS.escape) ? CSS.escape(s)
                                    : String(s).replace(/["\\]/g, "\\$&");
}

// Perks bought in a skill, as {perk, ranks}. This is what a card summarises,
// so keep it in tree order (which extract_perks sorted by skill gate) -- the
// list then reads as the order the character actually unlocked them.
function chosenIn(skill){
  const out = [];
  skill.perks.forEach(p => {
    const r = S.ranks.get(p.formId) || 0;
    if (r > 0) out.push({p, r});
  });
  return out;
}

const spentIn = skill =>
  skill.perks.reduce((n, p) => n + (S.ranks.get(p.formId) || 0), 0);

function renderCard(s){
  const pts = spentIn(s);
  const chosen = chosenIn(s);
  const lv = skillLevel(s);

  const list = chosen.length
    ? chosen.map(({p, r}) =>
        `<div class="p"><span class="bullet"></span>` +
        `<span class="nm">${esc(p.name)}</span>` +
        (p.ranks > 1 ? `<span class="rk">${r}/${p.ranks}</span>` : "") +
        `</div>`).join("")
    : `<div class="none">No perks chosen.</div>`;

  return `<button class="skillcard ${s.category.toLowerCase()}${pts ? " invested" : ""}"
      data-skill="${esc(s.editorId)}"
      aria-label="${esc(s.name)}, ${pts} point${pts === 1 ? "" : "s"} spent. Open perk tree.">
    <div class="top">
      <h3>${esc(s.name)}</h3>
      <span class="lv">
        <b class="${pts ? "" : "base"}">${lv}</b>
        <i>level</i>
      </span>
    </div>
    <div class="chosen">${list}</div>
    <div class="foot">
      <span class="pts">${pts}</span>
      <span>${pts === 1 ? "point" : "points"}</span>
      <span class="open">Open tree →</span>
    </div>
  </button>`;
}

// Refresh a single card in place. Closing the modal can only have changed the
// skill that was open, so rebuilding all 18 would needlessly detach every card
// (and any focus sitting on one).
function refreshCard(id){
  const s = skillById(id);
  const host = document.getElementById("groups");
  if (!s || !host) return false;
  const old = host.querySelector(`.skillcard[data-skill="${cssEsc(id)}"]`);
  if (!old) return false;

  const tmp = document.createElement("div");
  tmp.innerHTML = renderCard(s);
  old.replaceWith(tmp.firstElementChild);

  // The category tally above it moves with the spend.
  const group = host.querySelector(`.group.${s.category.toLowerCase()}`);
  const tally = group && group.querySelector(".tally");
  if (tally){
    const spent = P.skills.filter(x => x.category === s.category)
                          .reduce((n, x) => n + spentIn(x), 0);
    tally.innerHTML = spent ? `<b>${spent}</b> spent` : "&nbsp;";
  }
  return true;
}

function renderGroups(){
  const host = document.getElementById("groups");
  const vis = visibleSkills();

  host.innerHTML = CATEGORIES
    .map(cat => [cat, vis.filter(s => s.category === cat)])
    .filter(([, list]) => list.length)
    .map(([cat, list]) => {
      const spent = list.reduce((n, s) => n + spentIn(s), 0);
      return `<section class="group ${cat.toLowerCase()}">
        <div class="grouphead">
          <span class="cat"></span>
          <h2>${esc(cat)}</h2>
          <span class="tally">${spent ? `<b>${spent}</b> spent` : "&nbsp;"}</span>
        </div>
        <div class="cards">${list.map(renderCard).join("")}</div>
      </section>`;
    }).join("") || `<div class="empty">No skills to show.</div>`;
}

/* Draw one skill as the game draws it: perks on their AVIF grid cells, wired
   by the tree's own connection edges. Cells can hold two perks (a few trees
   stack them), so co-located perks are nudged apart along x. */
const CELL_W = 184, CELL_H = 108, PAD_X = 78, PAD_Y = 42, NODE_R = 9;
